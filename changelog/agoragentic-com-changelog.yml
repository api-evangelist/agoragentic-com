scheme: >-
  Keep a Changelog 1.1.0 + SemVer, but the versioned unit is the public integrations MANIFEST
  (integrations.json) and the individual packages, not the hosted API. The hosted API has no dated changelog
  of its own: /changelog, /changelog/, /developers/changelog/ and /status all return the site's catch-all
  HTML shell (HTTP 200, 53,574 bytes, identical to an unknown path), and the OpenAPI carries a single
  info.version (2.0.0) while the runtime reports 2.1.0. What the provider does publish is the first-party
  changelog of its public SDKs, MCP relay, CLI, n8n node and local-governance packages, which is the
  developer-facing change record for this API's client surface, so it is captured here.
