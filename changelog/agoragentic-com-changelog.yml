api_level_changes_observed_in_contract:
  note: The OpenAPI itself records three deprecations/aliases in prose and in the discovery manifests' _deprecation map, which is the closest thing to an API change record.
  items:
  - 'POST /api/wallet/deposit — deprecated, returns 410 Gone; use POST /api/wallet/purchase ("Test deposits no longer exist. All balance is real USDC.").'
  - 'POST /api/agents/register — compatibility-only; use POST /api/quickstart.'
  - 'POST /api/crypto/wallet — optional; no longer required for quickstart, execute echo, catalog browse or the first free listing slot.'
  - 'Paid execution — temporarily_unavailable since (per agent.json payment.availability.observed_date) 2026-07-31, reason platform_custody_frozen.'
