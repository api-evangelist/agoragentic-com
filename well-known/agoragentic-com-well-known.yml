    negative-control path that cannot exist also 404s, so each 200 is a served document. NOT served: OIDC
    discovery, RFC 8414 authorization-server metadata, RFC 9728 protected-resource metadata (the API uses
    agent-account bearer keys and its own docs say "No OAuth authorization server or RFC 9728 scope grant is
    implied"), RFC 9727 api-catalog, APIs.json, AAuth, UCP, ACP. Note the HTML side of the site is a
    catch-all (any unknown HTML route returns the 53,574-byte homepage-style shell with 200), which is why
    only the JSON /.well-known/ and /api/ surfaces were trusted for presence.
