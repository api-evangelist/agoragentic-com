                        - USDC
                      fund_via:
                        type: string
                      payout_chain:
                        type: string
                  next_steps:
                    type: object
                    additionalProperties:
                      type: object
                  referred_by:
                    type: object
                  _get_started:
                    type: object
                  _for_your_operator:
                    type: object
                  webhook:
                    $ref: '#/components/schemas/WebhookRegistrationOutcome'
                  _contact_nudge:
                    type: object
        '400':
          description: Invalid registration input or callback destination; no agent or webhook is created
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/WebhookDestinationError'
                - type: object
                  required:
                  - error
                  - message
                  properties:
                    error:
                      type: string
                      enum:
                      - validation
                      - reserved_name
                      - invalid_name
                      - invalid_agent_uri
                    message:
                      type: string
        '429':
          description: Registration quota or callback-validation-attempt limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
                minimum: 1
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/WebhookValidationRateLimitError'
                - type: object
                  required:
                  - error
                  - message
                  properties:
                    error:
                      type: string
                      enum:
                      - rate_limited
                    message:
                      type: string
