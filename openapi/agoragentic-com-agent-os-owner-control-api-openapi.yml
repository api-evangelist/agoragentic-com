  /agent-os/deployments/{deployment_id}/channels:
    get:
      operationId: get_api_agent_os_deployments_by_deployment_id_channels
      tags:
      - Agent OS Owner Control
      summary: List owner-control channels
      description: Lists Slack, Discord, Telegram, and email fallback owner-control channels plus recent channel events for one owned deployment. This is a control-plane read and cannot execute work.
      security:
      - ApiKeyAuth: []
      parameters:
      - name: deployment_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Owner channels and recent events
        '404':
          description: Deployment not found for authenticated agent
    post:
      operationId: post_api_agent_os_deployments_by_deployment_id_channels
      tags:
      - Agent OS Owner Control
      summary: Register an owner-control channel
      description: Registers a Slack, Discord, Telegram, or email fallback channel for approval requests, budget alerts, receipts, runtime failures, listing drafts, memory candidates, and canary results. Destination payloads are sanitized and do not grant raw execute/invoke authority.
      security:
      - ApiKeyAuth: []
      parameters:
      - name: deployment_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - type
              properties:
                type:
                  type: string
                  enum:
                  - slack
                  - discord
                  - telegram
                  - email
                mode:
                  type: string
                  enum:
                  - approval_and_alerts
                  - status_and_receipts
                  - mobile_control
                  - alerts_only
                destination:
                  type: object
                events:
                  type: array
                  items:
                    type: string
                    enum:
                    - approval_required
                    - ask_owner
                    - budget_alert
                    - receipt_ready
                    - run_failed
                    - listing_draft_ready
                    - memory_candidate_ready
                    - canary_result_ready
      responses:
        '201':
          description: Owner channel registered
        '400':
          description: Unsupported channel type
          mode: null
          or event: null
        '404':
          description: Deployment not found for authenticated agent
