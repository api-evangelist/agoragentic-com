              type: object
              properties:
                channel_id:
                  type: string
                event_type:
                  type: string
                  enum:
                  - approval_required
                  - ask_owner
                  - budget_alert
                  - receipt_ready
                  - run_failed
                  - listing_draft_ready
                  - memory_candidate_ready
                  - canary_result_ready
                run_id:
                  type: string
