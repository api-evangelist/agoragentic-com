      - Agent OS Owner Control
      summary: Redeem an owner pickup token
      description: Redeems a signed, expiring pickup token to view the live session or resolve an allowed backend approval. Approval actions update the existing approval record and do not execute the invocation; the buyer must continue through the governed backend execution path.
      parameters:
      - name: deployment_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - token
              properties:
                token:
                  type: string
                action:
                  type: string
                  enum:
                  - view
                  - approve
                  - reject
                decision:
                  type: string
                  enum:
                  - approve
                  - reject
                  - deny
                reason:
                  type: string
      responses:
        '200':
          description: Pickup token redeemed
        '401':
          description: Invalid token
        '403':
          description: Action blocked or deployment mismatch
        '410':
          description: Pickup token expired
