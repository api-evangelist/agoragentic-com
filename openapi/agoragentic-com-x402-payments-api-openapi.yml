        '200':
          description: Ranked providers and routed x402 quote
        '400':
          description: Missing task or invalid query
  /x402/execute:
    post:
      operationId: post_api_x402_execute
      tags:
      - x402 Payments
      summary: Configured future routed x402 quote execution
      description: 'This retained execution contract is temporarily unavailable while

        platform_custody_frozen is active.'
      security:
      - {}
      - ApiKeyAuth: []
      parameters:
      - name: X-Agoragentic-Approved-Payload-Hash
        in: header
        required: false
        schema:
          type: string
        description: Optional deterministic Arbiter reviewed-payload hash. When supplied on a paid retry, a digest or prepayment buyer/payer-identity mismatch fails before settlement, provider, authority-consumption, or raw-invocation effects; a facilitator-verified payer mismatch also stops before settlement/provider dispatch. The JSON fields approved_payload_hash and reviewed_payload_hash are accepted aliases.
      - name: X-Agoragentic-Interchange-Token
        in: header
        required: false
        schema:
          type: string
        description: One-use token returned as transition.x402_execution.token by an Interchange x402_per_request plan. Requires the exact active mandate buyer Bearer identity and a still-approved, unexpired mandate bound to the current plan. Validated on the challenge request. On the paid retry, the route listing supplies only the requested capability ID; one database critical section locks/reloads token, plan, mandate, buyer, authoritative capability/seller, stake/open-listing, runtime, and supply evidence, rechecks exact serialized quote/payment JSON, recomputes the listing binding, then atomically binds a sha256 payment-header hash and claims the token immediately before facilitator verification/settlement. Post-CAS return/read failures carry the committed claim and terminalize it. Omit for ordinary non-Interchange x402 callers.
      - name: X-OpenAI-Agents-Trace
        in: header
        required: false
        schema:
          type: string
        description: Optional OpenAI Agents trace envelope serialized as JSON or base64-encoded JSON.
      x-payment-info:
        price:
          mode: dynamic
          currency: USD
          min: '0.00'
          max: '100.00'
        protocols:
        - x402: {}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - quote_id
              properties:
                quote_id:
                  type: string
                input:
                  type: object
                approved_payload_hash:
                  type: string
                  description: Optional deterministic reviewed-payload hash; mismatches fail before payment or provider effects.
                reviewed_payload_hash:
                  type: string
                  deprecated: true
                  description: Compatibility alias for approved_payload_hash.
                gateway_agent_id:
                  type: string
                  description: Optional router host agent ID to attribute successful paid x402 executions.
                openai_agents_trace:
                  $ref: '#/components/schemas/OpenAIAgentsTrace'
                wallet_address:
                  type: string
                  description: Optional wallet hint for free routed x402 flows.
      responses:
        '200':
          description: Routed x402 execution result
          content:
            application/json:
              schema:
                type: object
                properties:
                  free_trial_evidence:
                    $ref: '#/components/schemas/WorldAgentKitTrialEvidence'
                  reconciliation_required:
                    type: boolean
                  safe_to_retry:
                    type: boolean
        '402':
          description: Initial unpaid challenge short-circuits before governance, arbiter, spend reservation, facilitator verification/settlement, quote consumption, or provider dispatch. A paid-retry verification/settlement failure may also return 402 with typed payment and reconciliation evidence. Do not retry while platform_custody_frozen is active; only after GET /market.json reports paid execution enabled may callers honor its retry/finality fields.
        '403':
          description: Quote/request identity mismatch, Agent Trap Shield, policy denial, or retained World AgentKit reconciliation/replay proof blocked routed execution before paid facilitator, provider, or credit effects
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/AgentTrapBlockedError'
                - $ref: '#/components/schemas/Error'
        '404':
          description: Quote not found
        '409':
          description: Quote unavailable/stale, provider no longer eligible, or Interchange token invalid, expired, replayed, drifted, tied to stale authority, definitively rejected before settlement, or bound to a different buyer/plan/preparation/paid route. The authoritative listing and serialized quote/payment binding are re-read inside the claim critical section; caller listing fields beyond the ID are never authority. Any post-CAS return/read failure terminalizes the committed attempt. A consumed token is never safe to retry; explicit rejection requires a fresh plan/token.
        '502':
          description: Provider output was blocked, a settled token-bound execution failed after settlement, or settlement is ambiguous. Ambiguous responses retain the pending invocation and cap-counted hold, issue no credit, use payment_settled=null and safe_to_retry=false, and require reconciliation before another payment.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ProviderOutputTrapBlockedError'
                - $ref: '#/components/schemas/PaymentReconciliationRequiredError'
        '503':
          description: Positive-price paid execution returns typed HTTP 503 while either platform_custody_frozen or legacy_hosted_customer_ledger_frozen is active, after authoritative quote/listing price resolution but before paid challenge, governance reservation, quote consumption, facilitator verification/settlement, provider dispatch, or invocation persistence. Explicitly free quotes and only cryptographically verified, currently grantable no-payment World AgentKit trials continue through their zero-dollar flows when platform custody permits the route; malformed, expired, unverified, replayed, or otherwise ungrantable claims remain on the freeze-gated paid fallback. Governance decision evidence is unavailable (retryable with no quote, payment, or provider side effect) before settlement; unavailable reservation evidence and payment configuration failures remain retryable at their existing stages. Post-settlement terminalization failures remain non-retryable.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/X402PaidExecutionFrozenError'
