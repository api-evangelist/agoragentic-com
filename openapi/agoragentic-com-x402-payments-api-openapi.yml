      - name: max_cost
        in: query
        required: false
        schema:
          type: number
          minimum: 0
          default: 10
        description: Maximum quoted price in USDC. Zero permits only explicitly free listings; blank, non-numeric, negative, and non-finite values return HTTP 400 before quote creation.
      - name: category
        in: query
        required: false
        schema:
          type: string
      - name: max_latency_ms
        in: query
        required: false
        schema:
