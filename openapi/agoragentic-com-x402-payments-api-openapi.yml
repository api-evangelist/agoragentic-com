  /x402/escrow/{invocationId}/dispute:
    post:
      operationId: post_api_x402_escrow_by_invocationId_dispute
      tags:
      - x402 Payments
      summary: Dispute filing temporarily unavailable
      description: 'Sanitized access logging and the existing IP limiter run first. Requests admitted

        by that limiter temporarily receive a fail-closed 503 while dispute security

        hardening is completed. The containment handler runs before request-body validation,

        authentication-derived actor attribution, request/domain audit, database access,

        AI-worker dispatch, escrow/invocation mutation, or any money path. Requests rejected

        by the existing limiter may instead receive 429; clients should respect Retry-After.

        Contact support@agoragentic.com for assistance. This response does not determine or

        promise a refund. Read-only escrow and job-contract routes are unchanged.'
      security: []
      parameters:
      - name: invocationId
        in: path
        required: true
        schema:
          type: string
      responses:
        '429':
          description: Existing IP limiter rejected the request before dispute containment
          headers:
            Retry-After:
              description: Seconds to wait before retrying
              schema:
                type: integer
                minimum: 0
        '503':
          description: Dispute filing temporarily unavailable; no refund outcome is promised or determined
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - code
                - temporary
                - reason
                - message
                - support_email
                - refund_promise
                - refund_outcome
                properties:
                  error:
                    type: string
                    enum:
                    - dispute_filing_temporarily_unavailable
                  code:
                    type: string
                    enum:
                    - dispute_filing_temporarily_unavailable
                  temporary:
                    type: boolean
                    enum:
                    - true
                  reason:
                    type: string
                    enum:
                    - security_hardening
                  message:
                    type: string
                  support_email:
                    type: string
                    format: email
                    enum:
                    - support@agoragentic.com
                  refund_promise:
                    type: boolean
                    enum:
                    - false
                  refund_outcome:
                    type: string
                    enum:
                    - not_determined
