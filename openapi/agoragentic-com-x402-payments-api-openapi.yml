          - arbitrum
          - world
          - solana
        description: Incoming payment rail. Defaults to base.
      - name: payment_asset
        in: query
        required: false
        schema:
          type: string
          enum:
          - USDC
          - USDT
        description: Incoming asset. USDT requires an explicit supported EVM payment_network.
