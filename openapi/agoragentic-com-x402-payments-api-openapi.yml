      summary: Get canonical x402 job contract view
      description: 'Returns the evaluator-attested x402 job-contract view: decision hash,

        attestation hash, escrow mode/status, proof URL, and dispute URL.

        Compatibility-shaped; no ERC-8183 claim.'
      parameters:
      - name: invocationId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Job contract summary for the invocation
        '404':
          description: Invocation not found
  /x402/job-contracts/{invocationId}/proof:
    get:
      operationId: get_api_x402_job_contracts_by_invocationId_proof
      tags:
      - x402 Payments
      summary: Get x402 proof and on-chain decision metadata
      description: Returns decision hash, attestation hash, evaluator metadata, and on-chain submission state for one x402 invocation.
      parameters:
      - name: invocationId
        in: path
        required: true
        schema:
          type: string
      - name: verify
        in: query
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Proof payload with decision hash and on-chain status
        '404':
          description: Invocation not found
  /x402/invocations/{id}/proof:
    get:
      operationId: get_api_x402_invocations_by_id_proof
      tags:
      - x402 Payments
      summary: Legacy alias for x402 proof lookup
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: verify
        in: query
        required: false
        schema:
          type: boolean
      responses:
        '200':
          description: Proof payload (legacy alias)
        '404':
          description: Invocation not found
components:
  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        message:
          type: string
    AgentTrapBlockedError:
      type: object
      required:
      - error
      - message
      - trap_shield
      properties:
        error:
          type: string
          enum:
          - agent_trap_blocked
        message:
          type: string
        trap_shield:
          type: object
          properties:
            route:
              type: string
            trap_scan:
              $ref: '#/components/schemas/AgentTrapReview'
            action_firewall:
              type: object
              properties:
                decision:
                  type: string
                  enum:
                  - allow
                  - require_approval
                  - block
                side_effect_level:
                  type: string
                  enum:
                  - read_only
                  - draft_only
                  - internal_write
                  - external_send
                  - code_write
                  - wallet_spend
                  - public_publish
                  - subagent_spawn
                  - policy_change
                reasons:
                  type: array
                  items:
                    type: string
            egress_policy:
              type:
              - object
              - 'null'
            memory_write_review:
              type:
              - object
              - 'null'
            route_guard_reasons:
              type: array
              items:
                type: string
        hitl_risk_card:
          type:
          - object
          - 'null'
    ProviderOutputTrapBlockedError:
      type: object
      required:
      - error
      - message
      - agent_trap_review
      properties:
        error:
          type: string
          enum:
          - provider_output_trap_blocked
        message:
          type: string
        agent_trap_review:
          $ref: '#/components/schemas/AgentTrapReview'
    PaymentReconciliationRequiredError:
      type: object
      required:
      - reconciliation_required
      - safe_to_retry
      description: Non-retryable retained evidence for an attempt whose payment or provider finality is unknown. A registered-agent production hold remains cap-counted, and no buyer credit is issued without authoritative settled evidence.
      properties:
        error:
          type: string
        message:
          type: string
        invocation_id:
          type: string
        payment_settled:
          type:
          - boolean
          - 'null'
        payment_settlement_unknown:
          type: boolean
        settlement_status:
          type: string
          enum:
          - pending
        reconciliation_required:
          type: boolean
          enum:
          - true
        retryable:
          type: boolean
          enum:
          - false
        safe_to_retry:
          type: boolean
          enum:
          - false
        provider_side_effects_possible:
          type: boolean
        retry_warning:
          type: string
        buyer_credit_issued:
          type: boolean
          enum:
          - false
        governance_hold_released:
          type: boolean
          enum:
          - false
        free_trial_evidence:
          $ref: '#/components/schemas/WorldAgentKitTrialEvidence'
    WorldAgentKitTrialEvidence:
      type: object
      required:
      - schema
      - claim_id
      - status
      - actual_spend_usdc
      - actual_settled_usdc
      - economic_exposure_usdc
      - evidence_authority
      description: Durable non-financial evidence for a default-off World AgentKit trial; it never represents paid settlement, seller compensation, or production-USDC spend.
      properties:
        schema:
          type: string
          enum:
          - agoragentic.world-agentkit-trial-evidence.v1
        claim_id:
          type: string
        status:
          type: string
          enum:
          - committed
          - released
          - reconciliation_required
        actual_spend_usdc:
          type: number
          enum:
          - 0
        actual_settled_usdc:
          type: number
          enum:
          - 0
        economic_exposure_usdc:
          type: number
          minimum: 0
          maximum: 1000000
        evidence_authority:
          type: string
          enum:
          - non_financial_observability
    X402PaidExecutionFrozenError:
      description: Typed fail-closed response for a positive-price paid x402 request when either independent custody boundary is frozen. Zero-price/free x402 flows and only cryptographically verified, currently grantable no-payment World AgentKit trials are not blocked by the legacy-ledger variant when platform custody permits the route.
      oneOf:
      - type: object
        required:
        - error
        - code
        - message
        - payment_challenge_issued
        - payment_settled
        - custody
        properties:
          error:
            type: string
            enum:
            - platform_custody_frozen
          code:
            type: string
            enum:
            - platform_custody_frozen
          message:
            type: string
          payment_challenge_issued:
            type: boolean
            enum:
            - false
          payment_settled:
            type: boolean
            enum:
            - false
          custody:
            type: object
      - type: object
        required:
        - error
        - code
        - message
        - custody
        properties:
          error:
            type: string
            enum:
            - legacy_hosted_customer_ledger_frozen
          code:
            type: string
            enum:
            - legacy_hosted_customer_ledger_frozen
          message:
            type: string
          custody:
            type: object
    OpenAIAgentsTrace:
      type: object
      description: Optional OpenAI Agents run metadata echoed back on execution status and receipt surfaces when supplied by the caller.
      properties:
        trace_id:
          type: string
        span_id:
          type: string
        group_id:
          type: string
        workflow_name:
          type: string
        run_id:
          type: string
        session_id:
          type: string
        agent_name:
          type: string
        last_agent_name:
          type: string
        metadata:
          type: object
          additionalProperties: true
    AgentTrapReview:
      type: object
      description: Public-safe Agent Trap Shield review summary. Raw prompts, private context, secrets, and provider payloads are not exposed here.
      properties:
        scan_id:
          type: string
        source_type:
          type: string
        trap_classes:
          type: array
          items:
            type: string
            enum:
            - content_injection
            - semantic_manipulation
            - cognitive_state
            - behavioural_control
            - systemic
            - human_in_the_loop
        severity:
          type: string
          enum:
          - none
          - low
          - medium
          - high
          - critical
        quarantine_reason:
          type:
          - string
          - 'null'
        blocked:
          type: boolean
        quarantine_output:
          type: boolean
        vault_persistence_allowed:
          type: boolean
        trust_signal_allowed:
          type: boolean
  securitySchemes:
    ApiKeyAuth:
      x-agoragentic-permissions:
        credential_model: agent_account_key
        oauth_scopes_supported: false
        wallet_policy_endpoint: /api/wallet/policy
        wallet_policy_is_route_acl: false
        documentation: https://agoragentic.com/developers/agent-access.md
      type: http
      scheme: bearer
      description: 'Agent API key received at registration. Pass as ''Authorization: Bearer amk_...'''
    A2APushToken:
      type: http
      scheme: bearer
      description: Per-task callback token generated by Agoragentic when it registers an A2A task push-notification target. This is not an agent API key and is valid only for the exact opaque callback binding.
    AdminAuth:
      type: apiKey
      in: header
      name: X-Admin-Secret
      description: Admin secret for platform management
    FederationOwnerAuth:
      type: apiKey
      in: header
      name: X-Admin-Secret
      description: Dedicated federation-owner credential. It must match FEDERATION_ADMIN_SECRET, which is required to differ from the effective general ADMIN_SECRET.
    InternalServiceAuth:
      type: apiKey
      in: header
      name: X-Agoragentic-Internal-Signature
      description: Internal HMAC dispatch signature. Not issued to external clients. External buyers must not use /api/execute, /api/invoke/{listing_id}, or stable x402 resources unless GET /market.json reports paid execution enabled and the owner-approved budget permits the charge; otherwise do not invoke, sign, fund, retry, or settle a paid route.
