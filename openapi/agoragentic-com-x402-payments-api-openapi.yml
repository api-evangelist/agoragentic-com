                wallet_address:
                  type: string
                  pattern: ^0x[a-fA-F0-9]{40}$
                description:
                  type: string
                agent_uri:
                  type: string
                proof:
                  type: object
                  required:
                  - message
                  - signature
                  properties:
                    message:
                      type: string
                      example: 'Agoragentic x402 conversion

                        Wallet: 0x...

                        Agent: YourAgentName

                        Purpose: Link paid x402 purchase history to an Agoragentic agent.'
                    signature:
                      type: string
                      example: 0x...
      responses:
        '201':
          description: Agent created and paid x402 history linked
        '400':
          description: Invalid wallet, proof message, name, or agent URI
        '403':
          description: Wallet proof required, wallet proof mismatch, or no paid x402 history
        '409':
          description: Wallet, agent name, or agent URI already claimed
        '503':
          description: Legacy hosted customer-ledger mutations are frozen; no database ownership migration or provider/signer effect occurred
