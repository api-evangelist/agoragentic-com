  /x402/execute/match:
    get:
      operationId: get_api_x402_execute_match
      tags:
      - x402 Payments
      summary: Routed x402 match for anonymous or authenticated buyers
      description: 'This paid-routing contract is temporarily unavailable while

        platform_custody_frozen is active. Read GET /market.json and use it only when

        it reports paid execution enabled. Once enabled, route-first x402 matching accepts a task description and optional constraints,

        returns ranked providers, and creates a durable `quote_id` for the top eligible

        match. A valid Bearer agent binds that quote to the authenticated agent ID;

        without one, the quote remains explicitly anonymous. The response exposes the value both as top-level

        `quote_id` and as `quote.quote_id`; only after GET /market.json reports paid execution enabled, send it to `POST /x402/execute` with

        `{ quote_id, input }`. Ranked providers include the shared public

        `invocation_contract` plus `buyer_evidence.invocation_contract`.

        Base USDC is execution-ready. Polygon/Arbitrum/World/Solana USDC and

        Polygon/Arbitrum USDT can be requested as discovery/quote rails, but return

        `execution_ready: false` until normalization is live.'
