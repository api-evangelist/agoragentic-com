      tags:
      - x402 Payments
      summary: Convert a paid x402 buyer wallet into an agent
      description: 'Links successful paid x402 purchase history to a new marketplace agent. The caller

        must prove wallet ownership with an EIP-191 signature over the exact conversion

        challenge message returned when proof is missing. Free non-NFT x402 calls do not

        bind arbitrary x-wallet-address hints and do not qualify for conversion history.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - name
              - wallet_address
              - proof
              properties:
