      responses:
        '200':
          description: First-party utility canary preview
        '400':
          description: Forbidden field or invalid request
        '401':
          description: Owner/admin authentication required
        '404':
          description: Candidate or fixture not found
  /agent-os/first-party-utilities/canaries/runs:
