      responses:
        '201':
          description: First-party utility canary recorded
        '400':
          description: Missing idempotency key
          missing write flag: null
          forbidden field: null
          or invalid request: null
        '401':
          description: Owner/admin authentication required
        '404':
          description: Candidate or fixture not found
    get:
      operationId: get_api_agent_os_first_party_utilities_canaries_runs
      tags:
      - Agent OS
      summary: List first-party utility canary runs
