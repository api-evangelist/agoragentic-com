      description: Requires the full relay function UUID; truncated IDs return invalid_relay_function_id.
      security:
      - ApiKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
