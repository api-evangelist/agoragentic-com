                  top_evaluated_agents_24h:
                    type: array
                    items:
                      type: object
                  top_governed_agents:
                    type: array
                    deprecated: true
                    items:
                      type: object
                  top_governed_agents_24h:
                    type: array
                    deprecated: true
                    items:
                      type: object
        '401':
          description: Owner/admin authentication required
  /admin/governance/decisions:
    get:
      operationId: get_api_admin_governance_decisions
      tags:
      - Admin
      summary: Read retained governance decisions by evidence phase
      description: 'Returns recent retained decision evidence, optionally filtered by phase. A row

        records what governance evaluated and decided at that phase; it does not prove an

        invocation, payment, settlement, provider call, receipt, or agent task. Use

        `correlation_ref` to join phase evidence where present and use durable invocation

        and receipt/settlement surfaces for outcomes. `total` is the true count matching

        the supplied filters, while `returned` is the bounded number of recent rows in

        `decisions`. The summary maps describe only those returned rows. Results use

        keyset pagination ordered by `created_at DESC, id DESC`. The first request fixes

        the newest sort-key upper bound, so rows above that bound cannot shift later pages.

        This is not a database transaction snapshot: normal retention expiry, and a

        concurrent insert sharing the boundary timestamp but sorting below its ID, can

        still alter the eligible set. SQLite records default decision timestamps at

        one-second resolution, so shared timestamps are expected during bursts.

        `next_cursor` is opaque and bound to the active filters. `limit` defaults to 50,

        is defensively capped at 500, and rejects malformed, fractional, zero, or negative

        values.'
      security:
      - AdminAuth: []
      parameters:
      - name: agent_id
        in: query
        required: false
        schema:
          type: string
          maxLength: 256
      - name: action
        in: query
        required: false
        schema:
          type: string
          maxLength: 160
      - name: verdict
        in: query
        required: false
        schema:
          type: string
          enum:
          - allow
          - deny
          - deny_absent
      - name: decision_kind
        in: query
        required: false
        schema:
          type: string
          maxLength: 80
          pattern: ^[A-Za-z0-9_.:-]+$
      - name: cursor
        in: query
        required: false
        description: Opaque keyset cursor returned by next_cursor. It is valid only with the same filters.
        schema:
          type: string
          maxLength: 4096
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 500
          default: 50
      responses:
        '200':
          description: Retained governance decision evidence
          content:
            application/json:
              schema:
                type: object
                required:
                - total
                - returned
                - limit
                - has_more
                - next_cursor
                - pagination
                - decisions
                - summary
                properties:
                  total:
                    type: integer
                    minimum: 0
                    description: True retained row count after applying every supplied filter.
                  returned:
                    type: integer
                    minimum: 0
                    maximum: 500
                    description: Number of bounded recent rows returned in decisions.
                  limit:
                    type: integer
                    minimum: 1
                    maximum: 500
                    description: Effective bounded row limit used for this response.
                  has_more:
                    type: boolean
                    description: Whether another keyset page exists within this request's fixed sort-key upper bound.
                  next_cursor:
                    type:
                    - string
                    - 'null'
                    description: Opaque cursor for the next page, or null when this page is final.
                  pagination:
                    type: object
                    required:
                    - mode
                    - fixed_upper_bound
                    - has_more
                    - next_cursor
                    properties:
                      mode:
                        type: string
                        enum:
                        - keyset
                      fixed_upper_bound:
                        type: boolean
                        enum:
                        - true
                      has_more:
                        type: boolean
                      next_cursor:
                        type:
                        - string
                        - 'null'
                  decisions:
                    type: array
                    maxItems: 500
                    items:
                      $ref: '#/components/schemas/GovernanceDecisionEvidence'
                  summary:
                    type: object
                    description: Breakdown of the returned decisions only, not the full filtered total.
                    properties:
                      by_verdict:
                        type: object
                        additionalProperties:
                          type: integer
                      by_action:
                        type: object
                        additionalProperties:
                          type: integer
                      by_decision_kind:
                        type: object
                        additionalProperties:
                          type: integer
        '400':
          description: invalid_limit, invalid_filter, or invalid_cursor; restart without a cursor after changing filters
        '403':
          description: Valid administrator secret required
  /admin/governance/decisions/export:
    get:
      operationId: get_api_admin_governance_decisions_export
      tags:
      - Admin
      summary: Export bounded redacted governance-decision evidence
      description: 'Downloads one filtered, fixed-sort-key-upper-bound view as CSV or JSON. Export is

        capped at 10,000 matching rows and returns 413 instead of truncating; narrow the

        filters and retry. `request_context` and `delegation_chain` are omitted from every

        row, CSV cells are protected against spreadsheet formula execution, and each

        successful export is recorded in the admin audit log. Rows remain authorization

        evidence, not invocation, payment, settlement, receipt, or task proof.'
      security:
      - AdminAuth: []
      parameters:
      - name: agent_id
        in: query
        required: false
        schema:
          type: string
          maxLength: 256
      - name: action
        in: query
        required: false
        schema:
          type: string
          maxLength: 160
      - name: verdict
        in: query
        required: false
        schema:
          type: string
          enum:
          - allow
          - deny
          - deny_absent
      - name: decision_kind
        in: query
        required: false
        schema:
          type: string
          maxLength: 80
          pattern: ^[A-Za-z0-9_.:-]+$
      - name: format
        in: query
        required: false
        schema:
          type: string
          enum:
          - csv
          - json
          default: csv
      responses:
        '200':
          description: Downloadable redacted evidence view
          headers:
            X-Governance-Export-Rows:
              description: Number of evidence rows in the download.
              schema:
                type: integer
                minimum: 0
                maximum: 10000
          content:
            text/csv:
              schema:
                type: string
            application/json:
              schema:
                type: object
                required:
                - generated_at
                - total
                - returned
                - filters
                - redacted_fields
                - decisions
                properties:
                  generated_at:
                    type: string
                    format: date-time
                  total:
                    type: integer
                    minimum: 0
                    maximum: 10000
                  returned:
                    type: integer
                    minimum: 0
                    maximum: 10000
                  filters:
                    type: object
                  redacted_fields:
                    type: array
                    items:
                      type: string
                      enum:
                      - request_context
                      - delegation_chain
                  decisions:
                    type: array
                    maxItems: 10000
                    items:
                      $ref: '#/components/schemas/GovernanceDecisionExportEvidence'
        '400':
          description: invalid_export_format or invalid_filter
        '403':
          description: Valid administrator secret required
        '413':
          description: More than 10,000 retained rows match; narrow the filters before exporting
