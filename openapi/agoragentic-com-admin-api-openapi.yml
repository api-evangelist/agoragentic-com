                    - string
                    - 'null'
                    format: date-time
                  sandbox_run_count:
                    type: integer
                  total_runs_returned:
                    type: integer
                  runs:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                      properties:
                        status:
                          type: string
                        artifacts_json:
                          type: object
                          description: Redacted raw artifact object. A current runner_incident follows SandboxRunnerIncident; recognized historical evidence can retain legacy fields.
                        network_events:
