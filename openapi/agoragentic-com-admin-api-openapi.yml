      tags:
      - Admin
      summary: Reconcile one uncertain hosted lifecycle operation
      description: Administrator-only reconciliation of an exact operation, worker, fence, and authoritative evidence bundle. Provider-backed recovery atomically resolves the bound durable provider-effect row and lifecycle record. This route does not dispatch a provider call or move money.
      security:
      - AdminAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - operation_id
              - worker_id
              - fence_token
              - resolution
              - evidence
              properties:
                operation_id:
                  type: string
                  minLength: 1
                worker_id:
                  type: string
                  minLength: 1
                fence_token:
                  type: integer
                  minimum: 0
