      tags:
      - Admin
      summary: Revoke a bounded federation capability-exchange canary
      description: 'Immediately closes the canary and its public-feed gate without revoking

        the underlying federation identity relationship. Sends nothing and

        moves no funds.'
      security:
      - AdminAuth: []
