          description: Canary not found
  /admin/agent-federation/capability-exchange/canaries/{canaryId}/pull:
    post:
      operationId: post_api_admin_agent_federation_capability_exch_cd1cc79af79b41a1
      tags:
      - Admin
      summary: Perform one bounded read-only capability-exchange pull
      description: 'Reserves one of two paired refreshes before network I/O, derives the

        Agent Card and x402 catalog URLs from the verified relationship origin,

        records the initiating shared-admin actor claim under a five-minute

        reservation lease, revalidates the immutable window, revocation state,

        active key, binding, and origin before each GET, after the final GET,

        and before success persistence, then applies

        SSRF/redirect/content-type/size and trap-scan gates, requires

        explicit current capability-exchange consent, and verifies that the

        card still declares the exact active Ed25519 federation key. This is

        declaration continuity, not a fresh signature over the changed card.

        A changed card hash is retained as point-in-time evidence and may

        proceed only under that exact declaration continuity; key substitution

        or consent withdrawal pauses the canary. The route stores only public

        normalized fields and hashes. Expired reservations fail closed on the

        next status read or pull, revoke the canary, and cause no replacement

        request. Instruction-like and credential-like

        normalized values are omitted with bounded audit counters. High-risk or

        hidden instructions in retained human-authored capability prose pause the

        canary, including patterns split across retained fields of one capability.

        Structural fields are inert for instruction interpretation; selected bounded

        identity, method/path, price, currency, and network values may remain as public

        evidence, while operation identifiers, schemas, and unknown fields are discarded.

        It never invokes a capability, executes

        a provider, routes, refers, pays, settles, or promotes trust.'
      security:
      - AdminAuth: []
      parameters:
      - in: path
        name: canaryId
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
      responses:
        '200':
          description: Public capability evidence normalized successfully
        '400':
          description: Request body must be empty
        '403':
          description: Isolated federation-admin authentication required
        '409':
          description: Canary inactive, expired, capped, or inside six-hour interval
        '502':
          description: Pull failed or was blocked; attempt remains durably counted
  /admin/agent-federation/capability-exchange/canaries/{canaryId}/revoke:
