                  evaluated_agents:
                    type: integer
                  evaluated_agents_24h:
                    type: integer
                  governed_agents:
                    type: integer
                    deprecated: true
                    description: Compatibility alias for configured_agents.
                  governed_agents_24h:
                    type: integer
                    deprecated: true
                    description: Compatibility alias for configured_agents_evaluated_24h.
                  coverage_semantics:
                    type: object
                  evidence_semantics:
                    type: object
                  decisions:
                    type: object
                  decisions_24h:
