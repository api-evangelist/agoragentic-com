  /admin/gates/day25:
    get:
      operationId: get_api_admin_gates_day25
      tags:
      - Admin
      summary: Read the three Day-25 recovery gates in one report
      description: 'Read-only dashboard for the issue-542 Day-25 gates. external_settlements

        counts only settlement_status=settled x402 calls from non-owner and

        non-first-party wallets (owner wallets, FIRST_PARTY_X402_WALLETS,

        banned or non-organic wallet buyers, and pseudonymous x402 ids

        excluded; wallets redacted). repeat_buyer requires an organic

        buyer back on a second distinct UTC day. receipt_propagation reuses the

        propagation reducer. Includes weekly organic cohorts with buyer and

        seller dimensions plus weekly organic volume_usdc - non-organic sellers

        are excluded by the same traffic labels, and rows without seller

        identity read null seller fields. Missing data reads null/unmet,

        never a fake pass.'
      security:
      - AdminAuth: []
      parameters:
      - name: days
        in: query
        schema:
          type: integer
          default: 30
          minimum: 1
          maximum: 90
      responses:
        '200':
          description: Read-only Day-25 gates report
          content:
            application/json:
              schema:
                type: object
                properties:
                  schema:
                    type: string
                    example: agoragentic.day25-gates.v1
                  owner_wallets_configured:
                    type: integer
                    description: Configured owner-wallet exclusions; wallet values are not returned.
                  first_party_x402_wallets_configured:
                    type: integer
                    description: Configured FIRST_PARTY_X402_WALLETS exclusions; wallet values are not returned.
                  gates:
                    type: object
                    description: external_settlements
                    repeat_buyer: null
                    receipt_propagation.: null
                  all_gates_met:
                    type: boolean
                  weekly_cohorts:
                    type: array
                    items:
                      type: object
                    description: 'Per Monday-UTC week: buyer fields plus distinct_sellers, returning_sellers, returning_seller_rate_pct (null without seller data), volume_usdc.'
                  organic_calls_counted:
                    type: integer
                  excluded_calls:
                    type: object
                  excluded_seller_calls:
                    type: object
                    description: Calls whose seller failed organic traffic-label classification, by label.
        '403':
          description: Invalid admin secret
  /admin/revenue-density:
    get:
      operationId: get_api_admin_revenue_density
      tags:
      - Admin
      summary: Read Golden Loop revenue-density economics
      description: 'Operator-only read-only economics guardrail for paid-call density, hosted

        runtime billing, self-serve launch completion, and manually supplied cost

        inputs. The report marks economics incomplete when monthly runtime cost,

        verification cost per run, operator hourly rate, or operator minutes per

        launch are missing instead of inventing margin. It does not

        bill customers, run hosted billing sweeps, scan deployments, mutate launch

        sessions, or call cloud billing APIs.

        real_x402 and primary x402_* marketplace counters require a stable wallet

        identity and exclude configured FIRST_PARTY_X402_WALLETS. Raw, excluded,

        and unattributed counters preserve total x402 paid-row visibility.

        Source query failures are exposed through data_availability; affected

        metrics are null and the decision remains incomplete rather than

        inventing zero demand, revenue, or activity.'
      security:
      - AdminAuth: []
      parameters:
      - name: days
        in: query
        schema:
          type: integer
          default: 7
          minimum: 1
          maximum: 90
      - name: monthly_cloud_runtime_cost_usdc
        in: query
        schema:
          type: number
        description: Explicit monthly cloud/runtime cost input.
      - name: verification_cost_per_run_usdc
        in: query
        schema:
          type: number
        description: Explicit verification/sandbox cost per run.
      - name: operator_hourly_rate_usdc
        in: query
        schema:
          type: number
        description: Explicit operator hourly rate in USDC.
      - name: operator_minutes_per_launch
        in: query
        schema:
          type: number
        description: Explicit operator minutes per launch/session.
      responses:
        '200':
          description: Read-only revenue-density report
          content:
            application/json:
              schema:
                type: object
                properties:
                  schema:
                    type: string
                    example: agoragentic.revenue-density.v1
                  read_only:
                    type: boolean
                    example: true
                  admin_only:
                    type: boolean
                    example: true
                  report_only:
                    type: boolean
                    example: true
                  live_rate:
                    type:
                    - number
                    - 'null'
                    example: 1
                  known_revenue_usdc:
                    type:
                    - number
                    - 'null'
                    example: 49.012
                  estimated_costs:
                    type: object
                  operator_cost_usdc:
                    type:
                    - number
                    - 'null'
                  margin:
                    type:
                    - number
                    - 'null'
                    description: Null when required cost inputs are missing or invalid.
                  missing_inputs:
                    type: array
                    items:
                      type: string
                    description: Required revenue-density env vars missing from the report input.
                  invalid_inputs:
                    type: array
                    items:
                      type: object
                    description: Negative or non-numeric cost inputs rejected from margin calculation.
                  data_availability:
                    type: object
                    description: Source-level query health. Unavailable sources make affected section metrics null and force an incomplete decision.
                  authority_boundary:
                    type: object
                    description: Proves the report cannot mutate customer budgets, wallet limits, launches, billing, settlement, trust, or routing.
                  marketplace:
                    type: object
                    description: Paid-call density and source-separated revenue. Includes first_party_x402_wallets_configured plus raw, excluded, and unattributed x402 counters; real_x402 requires a stable external wallet identity.
                  hosted_runtime:
                    type: object
                  self_serve_runtime:
                    type: object
                  costs:
                    type: object
                  unit_economics:
                    type: object
                  decision:
                    type: object
        '403':
          description: Invalid admin secret
  /admin/golden-loop/revenue-sources:
    get:
      operationId: get_api_admin_golden_loop_revenue_sources
      tags:
      - Admin
      summary: Read Golden Loop revenue sources with availability
      description: 'Admin-only read-only projection of the revenue-density report. Canary

        revenue remains separate from combined real revenue. Source query

        failures are explicit: affected sections set available to false,

        identify unavailable_sources, and return nullable totals instead of

        inventing zero revenue or activity. This operation does not bill,

        settle, spend, mutate wallets, publish listings, or invoke providers.'
      security:
      - AdminAuth: []
      parameters:
      - name: days
        in: query
        schema:
          type: integer
          default: 7
          minimum: 1
          maximum: 90
      - name: monthly_cloud_runtime_cost_usdc
        in: query
        schema:
          type: number
        description: Explicit monthly cloud/runtime cost input reused by the underlying report.
      - name: verification_cost_per_run_usdc
        in: query
        schema:
          type: number
        description: Explicit verification/sandbox cost per run reused by the underlying report.
      - name: operator_hourly_rate_usdc
        in: query
        schema:
          type: number
        description: Explicit operator hourly rate reused by the underlying report.
      - name: operator_minutes_per_launch
        in: query
        schema:
          type: number
        description: Explicit operator minutes per launch/session reused by the underlying report.
      responses:
        '200':
          description: Read-only revenue-source report with honest unavailable-source semantics
          content:
            application/json:
              schema:
                type: object
                required:
                - schema
                - data_availability
                - marketplace_revenue
                - hosted_runtime_revenue
                - combined_real_revenue_usdc
                - combined_real_platform_fee_usdc
                - note
                properties:
                  schema:
                    type: string
                    enum:
                    - agoragentic.golden-loop.revenue-sources.v1
                  period:
                    type:
                    - string
                    - 'null'
                    example: 7d
                  generated_at:
                    type:
                    - string
                    - 'null'
                    format: date-time
                  data_availability:
                    type: object
                    required:
                    - complete
                    - sections
                    - sources
                    properties:
                      complete:
                        type: boolean
                      sections:
                        type: object
                        required:
                        - marketplace
                        - hosted_runtime
                        - self_serve_runtime
                        - verification_activity
                        properties:
                          marketplace:
                            type: boolean
                          hosted_runtime:
                            type: boolean
                          self_serve_runtime:
                            type: boolean
                          verification_activity:
                            type: boolean
                      sources:
                        type: object
                        description: Per-source query health. unavailable_reason is storage_unavailable or query_failed when available is false.
                        additionalProperties:
                          type: object
                          required:
                          - available
                          - unavailable_reason
                          properties:
                            available:
                              type: boolean
                            unavailable_reason:
                              type:
                              - string
                              - 'null'
                              enum:
                              - storage_unavailable
                              - query_failed
                  marketplace_revenue:
                    type: object
                    required:
                    - available
                    - unavailable_sources
                    properties:
                      available:
                        type: boolean
                      unavailable_sources:
                        type: array
                        items:
                          type: object
                          required:
                          - source
                          - reason
                          properties:
                            source:
                              type: string
                            reason:
                              type: string
                              enum:
                              - storage_unavailable
                              - query_failed
                    additionalProperties: true
                    description: Source-separated marketplace revenue. Revenue counters can be null when available is false.
                  hosted_runtime_revenue:
                    type: object
                    required:
                    - available
                    - unavailable_sources
                    - estimated_mrr_usdc
                    - billed_runtime_revenue_usdc
                    - billable_deployments
                    - active_deployments
                    - note
                    properties:
                      available:
                        type: boolean
                      unavailable_sources:
                        type: array
                        items:
                          type: object
                          required:
                          - source
                          - reason
                          properties:
                            source:
                              type: string
                            reason:
                              type: string
                              enum:
                              - storage_unavailable
                              - query_failed
                      estimated_mrr_usdc:
                        type:
                        - number
                        - 'null'
                      billed_runtime_revenue_usdc:
                        type:
                        - number
                        - 'null'
                      billable_deployments:
                        type:
                        - integer
                        - 'null'
                      active_deployments:
                        type:
                        - integer
                        - 'null'
                      note:
                        type: string
                  combined_real_revenue_usdc:
                    type:
                    - number
                    - 'null'
                    description: Null unless both marketplace and hosted-runtime revenue sources are available.
                  combined_real_platform_fee_usdc:
                    type:
                    - number
                    - 'null'
                    description: Null when marketplace revenue evidence is unavailable.
                  note:
                    type: string
        '403':
          description: Invalid admin secret
        '500':
          description: Revenue-source report failed
