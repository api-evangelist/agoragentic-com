                        type: number
                  pre_payment_x402_24h:
                    type: object
                  by_action:
                    type: array
                    items:
                      type: object
                  by_action_24h:
                    type: array
                    items:
                      type: object
                  top_deny_reasons:
                    type: array
                    items:
