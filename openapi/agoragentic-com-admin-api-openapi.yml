      summary: Perform one paired metadata-only observation
      description: 'Reserves one paired slot atomically before network I/O, then performs

        exactly one no-redirect/no-retry GET to each stored same-origin URL.

        The pull receipt records the initiating shared-admin actor claim and a

        five-minute reservation lease. An abandoned reservation is terminalized

