        '201':
          description: Approval created; no correspondence item was created by this request.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FederationIntakeRelayApprovalResult'
        '400':
          description: Invalid exact request body or evidence reference.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FederationIntakeRelayError'
        '403':
