        or operational authority. A paused canary can resume only with the exact

        same immutable window; after revocation or expiry, the same relationship

        and owner-approval reference cannot create a fresh budget. The

        canary may open only the existing public-safe capability feed and grants

        no execution, routing, referral, payment, credential, private-data,

