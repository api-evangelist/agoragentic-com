  /admin/governance/overview:
    get:
      operationId: get_api_admin_governance_overview
      tags:
      - Admin
      summary: Inspect governance evidence, execution outcomes, and reservation state
      description: 'Read-only governance overview. `policy_decisions` are retained authorization

        evidence, not agent memory, queued jobs, or proof that a provider ran. The

        `by_decision_kind` blocks separate `legacy`, `preview`, `simulation`,

        `authorization_precheck`, and `authorization_attempt`; legacy rows predate phase

        tagging and cannot be safely reclassified. Durable invocation rows are the

        execution-outcome source of truth, while receipts and settlement records remain

        separate proof surfaces. Reservation counters distinguish unbacked active holds,

        invocation-backed residual cap holds, pending commits, committed rows, and

        inactive released/expired rows. A large retained count (for example 5,500+)

        is not a count of agents, memories, jobs, or executions: one request can emit

        preview, precheck, and final-attempt evidence. `by_action` shows what was

        controlled, `by_decision_kind` shows the phase, and durable invocations/receipts

        show what actually ran. PostgreSQL caps the 23 independent overview reads at

        three concurrent queries per request; SQLite keeps serialized adapter behavior.'
      security:
      - AdminAuth: []
      responses:
        '200':
          description: Governance overview with explicitly separated evidence and outcome semantics
          content:
            application/json:
              schema:
                type: object
                properties:
                  generated_at:
                    type: string
