  /admin/listings/{listing_id}/reject:
    post:
      operationId: post_api_admin_listings_by_listing_id_reject
      tags:
      - Admin
      summary: Explicitly reject and remove a listing
      description: 'Canonical manual rejection. A non-empty reason of at most 1000 characters is

        required together with the complete three-field `decision_evidence` snapshot from

        the pending queue. The compare-and-set mutation is transactional: it sets

        `status=removed` and `review_status=rejected`, appends durable

        rejection evidence while preserving the observed sandbox status/run reference,

        and prevents a stale sandbox completion from promoting the row because approval

        completion only transitions a still-pending gate. Audit, trust-cache invalidation,

        and seller notification are best-effort side effects reported separately; a

        side-effect failure does not roll back a committed rejection.'
      security:
      - AdminAuth: []
      parameters:
      - name: listing_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
              - $ref: '#/components/schemas/ListingDecisionEvidenceRequest'
              - type: object
                required:
                - reason
                properties:
                  reason:
                    type: string
                    minLength: 1
                    maxLength: 1000
      responses:
        '200':
          description: Listing rejection committed
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - listing_id
                - status
                - reason
                - rejected_at
                - reviewed_by
                - previous
                - next
                - side_effects
                properties:
                  success:
                    type: boolean
                    enum:
                    - true
                  listing_id:
                    type: string
                    format: uuid
                  status:
                    type: string
                    enum:
                    - rejected
                  reason:
                    type: string
                  rejected_at:
                    type: string
                    format: date-time
                  reviewed_by:
                    type: string
                  previous:
                    type: object
                  next:
                    type: object
                  side_effects:
                    type: object
        '400':
          description: Rejection reason or complete decision evidence is missing or invalid
        '404':
          description: Listing not found
        '409':
          description: Listing evidence changed before rejection could be committed; no rejection was recorded
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - message
                - current_evidence
                properties:
                  error:
                    type: string
                    enum:
                    - stale_listing_state
                  message:
                    type: string
                  current_evidence:
                    $ref: '#/components/schemas/ListingDecisionEvidence'
        '500':
          description: Rejection failed before the listing mutation committed
  /admin/listings/{listing_id}/sandbox-history:
    get:
      operationId: get_api_admin_listings_by_listing_id_sandbox_history
      tags:
      - Admin
      summary: Inspect listing sandbox history and current trust state
      description: 'Returns redacted stored sandbox runs plus the listing''s current sandbox fields.

        Current probe-runtime incidents follow `SandboxRunnerIncident`. Historical raw

        artifacts can retain legacy scope/origin values and are not rewritten by this

        read. A resolver-runtime incident (`EBUSY` or `EAI_AGAIN`) is non-authoritative,

        forces no seller/platform attribution, and can queue bounded replacement

        DNS-pinned proof. `FULL_PROBE_UNAVAILABLE` means the required full probe did not

        run and no unpinned fallback was attempted, so manual review is required.

        Neither incident changes listing approval or overwrites a prior terminal sandbox

        observation. Internal recovery/audit evidence therefore distinguishes

        `listing_approval_retained` from `terminal_sandbox_trust_retained`; the latter is

        true only when a prior terminal observation actually exists.'
      security:
      - AdminAuth: []
      parameters:
      - name: listing_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: limit
        in: query
        required: false
        schema:
          type: integer
