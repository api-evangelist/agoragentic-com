  /admin/hosting/deployments/{id}/activate:
    post:
      operationId: post_api_admin_hosting_deployments_by_id_activate
      tags:
      - Admin
      summary: Evaluate provider readiness and optionally publish a hosted listing
      description: 'Operator-only activation bridge using the same activation outcome contract as the owner

        route. With `publish_listing=true`, publication occurs only after fulfillment review, smoke,

        and intent reconciliation pass and the provider reports the exact ready service/trust/public-

        HTTPS contract. Supported pricing plus the immutable paid floor are enforced. Runtime

        activation may be successful while a new/content-changed listing remains active/pending in

        semantic owner review before sandbox queueing, or while an unchanged approved listing''s

        sandbox proof is queued, pending, or in sanitized queue error. The listing stays non-

        invokable, x402 compatibility invoke metadata remains null with `x402_listing_pending` or

        `x402_listing_blocked`, and canonical read-time hydration controls effective exposure. Non-ready providers return HTTP 202

        with `success=false`, `activated=false`, readiness details, and no listing. Existing listing

        rows must remain seller-owned, hosted/platform-hosted, exact active/approved, and revision-

        unchanged; otherwise their current state is preserved and the same negative shape returns at

        HTTP 409. Admin hosting never autoapproves or silently resumes those rows. Persisted listing

        economics are checked before the activation provider effect; an omitted activation price defaults

        to exact zero, while malformed/conflicting/below-floor values return a typed 400.'
      security:
      - AdminAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                publish_listing:
                  type: boolean
      responses:
        '202':
          description: Hosted activation status returned, including honest non-ready outcomes
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/HostedActivationOutcome'
                - $ref: '#/components/schemas/Error'
        '400':
          description: Invalid hosted endpoint, pricing model, or invalid/conflicting/below-floor price
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/HostedListingEconomicsError'
                - $ref: '#/components/schemas/Error'
        '409':
          description: Existing hosted listing state/revision was preserved or another activation conflict requires repair/reconciliation
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/HostedActivationOutcome'
                - $ref: '#/components/schemas/Error'
components:
  schemas:
    FederationIntakeRelayError:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: string
          description: Bounded federation_steward_intake_relay_* refusal code, or forbidden for an invalid dedicated credential.
    HostedActivationOutcome:
      type: object
      description: 'Hosted runtime activation and marketplace verification are independent. `activated=true`

        means the provider returned the exact ready status/service/trust/public-HTTPS contract;

        it does not approve marketplace content. A new or review-content-changed listing is active

        but pending review, reports `content_review_required=true`, and does not queue sandbox proof

        until semantic review and owner release. Only an exact-identity unchanged already approved

        listing preserves approval and queues reverification. Every listing remains execution-

        ineligible until current canonical proof passes. Detail/list/replay presentation is hydrated

        from the canonical capability row so cached provider state cannot keep exposure effective.

        For x402 exposure, pending/blocked candidates keep both marketplace direct invoke and x402

        compatibility invoke paths null and report `x402_listing_pending` or `x402_listing_blocked`;

        live compatibility status is emitted only after the canonical listing becomes effective.

        Provider-not-ready outcomes return HTTP 202 with `success=false`, `activated=false`, and

        no listing. Existing bound-listing review/lifecycle/revision conflicts preserve that row

        and return the same negative shape at HTTP 409; hosting never autoapproves or resumes it.

        '
      required:
      - success
      - activated
      - activation
      - activation_gate
      - activation_readiness
      - listing
      - marketplace_verification
      - exposure
      - deployment_surface
      - deployment
      properties:
        success:
          type: boolean
        error:
          type: string
          description: Stable reason code on a blocked/non-ready outcome.
        http_status:
          type: integer
          enum:
          - 202
          - 409
        activated:
          type: boolean
        activation:
          type:
          - object
          - 'null'
          additionalProperties: true
        activation_gate:
          type: object
          additionalProperties: true
        activation_readiness:
          $ref: '#/components/schemas/HostedActivationReadiness'
        listing:
          type:
          - object
          - 'null'
          properties:
            id:
              type: string
              format: uuid
            slug:
              type: string
            status:
              type: string
              description: Current canonical listing lifecycle status on hydrated replay.
            review_status:
              type: string
              description: Current canonical listing review status on hydrated replay.
            content_review_required:
              type: boolean
              description: True for a new listing or any review-bound content change; hosted runtime readiness cannot clear this review gate.
            semantic_review_scheduled:
              type: boolean
              description: Present for content-review-gated publication and true only when off-response-path semantic review was scheduled.
            review_changed_fields:
              type: array
              items:
                type: string
              description: Review-bound fields that changed; a new listing reports `new_listing`.
            execution_eligible:
              type: boolean
              description: False on initial activation; hydrated replay can become true only from current canonical eligibility.
            marketplace_verification:
              $ref: '#/components/schemas/HostedMarketplaceVerification'
        marketplace_verification:
          $ref: '#/components/schemas/HostedMarketplaceVerification'
        exposure:
          type: object
          additionalProperties: true
          description: Canonical hosted exposure decision. `marketplace_listing_publication_authorized` permits a review-gated create/update; only `marketplace_listing_effective=true` authorizes live marketplace/direct-invoke/x402 presentation.
        deployment_surface:
          type: object
          additionalProperties: true
          description: Canonically hydrated runtime/marketplace/x402 surface. For an x402 candidate that is not effective, marketplace direct invoke and `x402.compatibility_invoke_path` are null and `x402.stable_edge_status` is `x402_listing_pending` or `x402_listing_blocked`; live compatibility statuses require an effective listing.
        deployment:
          type: object
          additionalProperties: true
        message:
          type: string
        agent_os_deploy:
          type: object
          additionalProperties: true
    ListingReviewQueueReason:
      type: object
      required:
      - code
      - label
      - message
      - next_step
      - source
      - fixable
      description: Canonical admin presentation derived from stored review evidence; it does not rewrite the raw review_notes artifact.
      properties:
        code:
          type: string
        label:
          type: string
        message:
          type: string
        next_step:
          type: string
        source:
          type: string
        fixable:
          type: boolean
    FederationIntakeRelayApprovalResult:
      type: object
      additionalProperties: false
      required:
      - created
      - approval
      properties:
        created:
          type: boolean
        approval:
          $ref: '#/components/schemas/FederationIntakeRelayApproval'
    HostedListingEconomicsError:
      type: object
      description: Hosted listing economics were rejected from the raw request or persisted listing draft before the applicable live provider effects. Strict decimal strings exclude signs, exponent notation, hexadecimal notation, and positive values that underflow to zero; exact numeric/string zero is the free lane.
      required:
      - error
      - message
      - details
      properties:
        error:
          type: string
          enum:
          - invalid_hosted_listing_pricing_model
          - invalid_hosted_listing_price
          - hosted_listing_price_conflict
          - hosted_listing_price_too_low
        message:
          type: string
        details:
          type: object
          additionalProperties: true
    AgentTrapEventsAdminResponse:
      type: object
      properties:
        schema:
          type: string
          example: agoragentic.agent-trap-events-admin.v1
        read_only:
          type: boolean
          example: true
        filters:
          type: object
        total:
          type: integer
        limit:
          type: integer
        offset:
          type: integer
        events:
          type: array
          items:
            $ref: '#/components/schemas/AgentTrapEvent'
        public_boundary:
          type: object
    ListingDecisionEvidenceRequest:
      type: object
      description: Complete evidence snapshot returned as `decision_evidence` by the pending-listings queue.
      required:
      - expected_updated_at
      - expected_listing_revision
      - expected_sandbox_run_id
      properties:
        expected_updated_at:
          type: string
          minLength: 1
        expected_listing_revision:
          type: string
          pattern: ^sha256:[0-9a-f]{64}$
        expected_sandbox_run_id:
          type:
          - string
          - 'null'
    HostedMarketplaceVerification:
      type: object
      description: Marketplace content review and runtime proof are separate from hosted runtime activation. New or review-content-changed listings use `pending` with reason `semantic_owner_review_pending_before_sandbox_queue` and no run until semantic review plus owner release allow canonical proof queueing. A review scheduling error is sanitized as `semantic_review_schedule_operational_error` and is retryable. Exact-identity unchanged approved listings may initially report queued/pending/queue_error sandbox state. Completed replay is rebuilt from the canonical listing and may report verified, reachable, pending, failed, or blocked. The narrow legacy NULL-status plus positive-success proof is labeled only `reachable` with reason `legacy_successful_runtime_proof`, never `verified`. `run_id` is exposed only for a current canonical sandbox status of verified/reachable; legacy, pending, failed, and blocked lanes return null. Blocked/non-ready activation uses `not_requested` because no listing is published.
      required:
      - required
      - status
      - execution_eligible
      - retry_required
      - run_id
      - reason
      properties:
        required:
          type: boolean
        status:
          type: string
          enum:
          - not_requested
          - queued
          - pending
          - queue_error
          - verified
          - reachable
          - failed
          - blocked
        execution_eligible:
          type:
          - boolean
          - 'null'
