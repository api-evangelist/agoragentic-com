        status, byte count, and canonical media type. Instruction-like and credential-like

        normalized values are omitted with bounded audit counters. High-risk or

        hidden instructions in retained human-authored capability prose close the

        observation, including patterns split across retained fields of one capability.

        Structural fields are inert for instruction interpretation; selected bounded

        identity, method/path, price, currency, and network values may remain as public

        evidence, while operation identifiers, schemas, and unknown fields are discarded.

        A failed or blocked pull remains

        counted, and the second reservation automatically closes the budget.'
