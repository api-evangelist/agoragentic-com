    HostedActivationReadiness:
      type: object
      description: Stable readiness explanation for a hosted activation result. A blocked result is not activation proof and must follow `next_step` before a new activation occurrence.
      required:
      - status
      - reason
      - retryable
      - next_step
      - checks
      properties:
        status:
          type: string
          enum:
          - ready
          - blocked
        reason:
          type: string
        retryable:
          type: boolean
          description: Whether a fresh occurrence may be useful after completing the documented next step. Exact idempotent replay never dispatches the adapter again.
        next_step:
          type:
          - string
          - 'null'
        checks:
          type: object
          additionalProperties:
            type: boolean
    GovernanceDecisionKind:
      type: string
      enum:
      - legacy
      - authorization_precheck
      - preview
      - authorization_attempt
      - simulation
      description: 'Phase tag for retained governance evidence. `legacy` means the row predates

        phase tagging and cannot be safely reclassified. `preview` is a non-authorizing

        provider/match preview, and `simulation` is an explicitly hypothetical policy

        check; neither authorizes execution. `authorization_precheck` is a policy

        evaluation before final spend admission and does not prove that an invocation,

        payment, settlement, or provider call occurred. `authorization_attempt` is the

        authoritative admission verdict for a provider-bound attempt. Production

        registered-agent attempts subject to rolling spend limits bind a reservation;

        denied attempts and zero-production-cost Tumbler attempts have no production

        USDC reservation.

        '
