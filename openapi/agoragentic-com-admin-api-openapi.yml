                        type: string
                        enum:
                        - tumbler
                      production_usdc_cap_included:
                        type: boolean
                        enum:
                        - false
                      invocation_total:
                        type: integer
                      counted_invocation_total:
                        type: integer
                      counted_invocation_24h:
                        type: integer
                      lifetime_tusdc:
