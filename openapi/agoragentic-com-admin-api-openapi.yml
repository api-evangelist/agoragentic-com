  /admin/hosting/deployments/{id}/provision:
    post:
      operationId: post_api_admin_hosting_deployments_by_id_provision
      tags:
      - Admin
      summary: Run the managed runtime provisioning bridge
      description: Operator-only live fulfillment path for supported hosted deployments. Requires one matching idempotency key across the documented body and header aliases. Uses the same deployment-wide provider-effect lock, immutable provider projection, and pre-dispatch owner/configuration/projection fences as agent, self-serve, and Start provisioning. Missing or conflicting keys fail before any provider call. An active effect blocks every new effect for the deployment; an indeterminate effect requires explicit reconciliation. Current live scope is limited to eligible managed-runtime requests. Persists the public runtime address and operation state needed for audit and rollback.
      security:
      - AdminAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 256
        description: Required here or through an identical JSON-body key alias.
      - name: X-Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 256
        description: Compatibility alias; must match every other supplied key source.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                idempotency_key:
                  type: string
                  minLength: 1
                  maxLength: 256
                idempotencyKey:
                  type: string
                  minLength: 1
                  maxLength: 256
                request_id:
                  type: string
                  minLength: 1
                  maxLength: 256
                requestId:
                  type: string
                  minLength: 1
                  maxLength: 256
      responses:
        '202':
          description: Hosted provisioning started
        '400':
          description: Missing or invalid idempotency key, or conflicting key sources
        '409':
          description: Owner/plan/configuration/projection conflict, active different provider effect, or indeterminate outcome requiring explicit reconciliation
  /admin/hosting/deployments/{id}/runtime-proxy-cutover:
    post:
      operationId: post_api_admin_hosting_deployments_by_id_runtime_proxy_cutover
      tags:
      - Admin
      summary: Recover or abandon a failed native runtime proxy cutover
      description: Administrator-only compare-and-swap transition for a native runtime proxy cutover in `rollback_required`. Retry requires the exact current deployment, migration, credential-version, and candidate-image evidence plus a different platform-configured allowlisted immutable image. Abandon permanently revokes the failed cutover. This route does not dispatch a provider call or move money.
      security:
      - AdminAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - action
              - expected_deployment_updated_at
              - expected_migration_updated_at
              - expected_credential_version
              - expected_candidate_image_digest
              properties:
                action:
                  type: string
                  enum:
                  - retry
                  - abandon
                expected_deployment_updated_at:
                  type: string
                  format: date-time
                expected_migration_updated_at:
                  type: string
                  format: date-time
                expected_credential_version:
                  type: integer
                  minimum: 1
                expected_candidate_image_digest:
                  type: string
                  pattern: ^.+@sha256:[a-fA-F0-9]{64}$
                replacement_image_digest:
                  type: string
                  pattern: ^.+@sha256:[a-fA-F0-9]{64}$
                  description: Required for retry and must equal the different platform-configured allowlisted image.
                reason:
                  type: string
      responses:
        '202':
          description: Runtime proxy cutover transition recorded
        '400':
          description: Invalid action, unexpected field, or non-native deployment
        '403':
          description: Missing or invalid administrator secret
        '404':
          description: Deployment not found
        '409':
          description: Cutover is not rollback-required, compare-and-swap evidence is stale, or the retry image is invalid
