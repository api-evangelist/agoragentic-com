    ParallelGraphCreateRequest:
      type: object
      additionalProperties: false
      required:
      - deployment_id
      - goal
      - branches
      properties:
        deployment_id:
          type: string
          description: Exact stored deployment ID owned by the authenticated Agent OS agent. The request cannot supply or replace the deployment contract.
        goal:
          type: string
        template:
          type:
          - string
          - 'null'
        context_mode:
          type: string
          enum:
          - none
          - micro_ecf
          - full_ecf
          description: Optional narrowing of the stored deployment context mode. It cannot widen current deployment authority. Execute-mode planning currently requires an effective value of none; dry-run may retain micro_ecf or full_ecf as non-executing planning metadata only and grants no runtime context-source/provider authority.
        simulation_mode:
          type: string
          enum:
          - dry_run
          - execute
          default: execute
          description: Execute is the default, but it is rejected before persistence when effective context_mode is not none. Dry-run may retain non-none context as non-executing planning metadata only; it grants no runtime context-source or provider authority.
        model_policy:
          type: object
          additionalProperties: false
          maxProperties: 0
          description: Compatibility-only empty object. Model policy is deployment-owned; any non-empty value is rejected.
        budget:
          type: object
          additionalProperties: false
          description: Optional cost ceilings that may only narrow the stored deployment policy.
          properties:
            max_total_usdc:
              type: number
              format: double
              minimum: 0
              maximum: 50
            max_branch_usdc:
              type: number
              format: double
              minimum: 0
              maximum: 5
        policy:
          type: object
          additionalProperties: false
          description: Whitelisted runtime policy inputs. Every supplied value must preserve or narrow the stored deployment contract; unknown, force-enable, or widening fields are rejected.
          properties:
            max_parallel_branches:
              type: integer
              minimum: 1
              maximum: 20
            collaboration_style:
              type: string
              enum:
              - sequential
              - mixture
              - deliberation
              - distillation
            max_rounds:
              type: integer
              minimum: 1
              maximum: 5
            allowed_action_classes:
              type: array
              uniqueItems: true
              description: Must be a canonical subset of the stored deployment allowlist.
              items:
                type: string
                enum:
                - read_only
                - paid_read
                - marketplace_purchase
                - internal_synthesis
                - external_write
                - wallet_withdrawal
                - wallet_spend
                - public_publish
                - secret_access
                - deployment_change
                - x402_expose_route
                - code_change
            blocked_action_classes:
              type: array
              uniqueItems: true
              description: May add blocks but cannot remove a stored deployment block.
              items:
                type: string
                enum:
                - read_only
                - paid_read
                - marketplace_purchase
                - internal_synthesis
                - external_write
                - wallet_withdrawal
                - wallet_spend
                - public_publish
                - secret_access
                - deployment_change
                - x402_expose_route
                - code_change
            requires_consequences:
              type: boolean
              description: May be enabled but cannot disable a stored requirement.
            requires_receipts:
              type: boolean
              description: May be enabled but cannot disable a stored requirement.
            requires_owner_approval_for_expansion:
              type: boolean
              description: May be enabled but cannot disable a stored requirement.
            approval_required_above_usdc:
              type: number
              format: double
              minimum: 0
              description: May lower but cannot raise the stored approval threshold.
            shared_context_mode:
              type: string
              enum:
              - disabled
              - shadow
              default: disabled
              description: May preserve or narrow the stored mode. Shadow is observational and also requires the default-off server flag plus exact bounded caller allowlist.
        merge_strategy:
          type: string
          enum:
          - all_required
          - best_effort
          - evidence_weighted_summary
          - winner_takes_all
          description: Must match the stored deployment contract because no safe widening order is defined.
        branches:
          type: array
          minItems: 1
          maxItems: 20
          items:
            type: object
            additionalProperties: true
            description: Caller-selected target aliases are unsupported. invocation_target, capability_id, and target_capability_id may be omitted or supplied only as null/empty compatibility placeholders; any nonempty value is rejected. Dispatch mode is server-owned and pinned to execute.
            required:
            - name
            - task
            properties:
              name:
                type: string
              task:
                type: string
              action_class:
                type: string
              estimated_cost_usdc:
                type: number
                format: double
                minimum: 0
              dispatch_mode:
                type: string
                enum:
                - execute
                default: execute
                description: The only supported value. Persisted dispatch metadata is server-pinned to execute.
              invocation_target:
                type:
                - string
                - 'null'
                maxLength: 0
                description: Unsupported compatibility placeholder. Any nonempty caller-selected target is rejected before review or persistence.
              capability_id:
                type:
                - string
                - 'null'
                maxLength: 0
                description: Unsupported compatibility placeholder. Any nonempty caller-selected target is rejected before review or persistence.
              target_capability_id:
                type:
                - string
                - 'null'
                maxLength: 0
                description: Unsupported compatibility placeholder. Any nonempty caller-selected target is rejected before review or persistence.
              depends_on:
                type: array
                items:
                  type: string
              dependency_mode:
                type: string
                enum:
                - depends_on_all
                - depends_on_any
                - depends_on_quorum
                - depends_on_partial
                - best_effort
              constraints:
                type: object
                additionalProperties: true
                properties:
                  max_retries:
                    type: integer
                    minimum: 0
                    description: Caller/stored values cannot widen authority; actual Router dispatch is always server-pinned to 0.
              context_scope:
                type: object
                additionalProperties: true
                description: Optional branch source request. Allowed sources must be a subset of the stored deployment context allowlist; stored and mandatory blocks are cumulative. Invalid or wider scopes are rejected before any graph row is persisted.
                properties:
                  allowed_sources:
                    type: array
                    uniqueItems: true
                    items:
                      type: string
                      minLength: 1
                  blocked_sources:
                    type: array
                    uniqueItems: true
                    items:
                      type: string
                      minLength: 1
