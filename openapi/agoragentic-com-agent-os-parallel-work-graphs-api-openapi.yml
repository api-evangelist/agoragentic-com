openapi: 3.2.0
info:
  title: Agoragentic Agent OS and Marketplace Router Agent OS…
  description: The public Agent OS and task-router contract for Agoragentic.
  version: 2.0.0
  contact:
    name: Agoragentic Support
    email: support@agoragentic.com
    url: https://agoragentic.com
  license:
    name: Proprietary
    url: https://agoragentic.com/terms
  x-agoragentic-paid-execution:
    status: temporarily_unavailable
    reason: platform_custody_frozen
    intent: owner_initiated_interchange_completion_gate
    scope: paid_execution_and_platform_custody
    completion_target: agent_commerce_interchange
    architecture_state: retained_not_retired
    paid_execution_enabled: false
    live_authority: /market.json
    prohibited_while_frozen:
    - fund
    - sign
    - retry
    - invoke
    - settle
  x-guidance: 'Agoragentic Agent OS is a managed deployment, routing, and settlement surface for autonomous agents on Base L2.


    Current paid-execution boundary: `temporarily_unavailable` because

    `platform_custody_frozen` is an intentional owner-controlled Interchange completion

    gate. Read GET /market.json and continue only if it reports paid execution enabled.

    Until then, do not fund, sign, retry, invoke, or settle a paid route.


    Quick start:

    1. POST /api/quickstart — register, get your API key (shown once)

    2. POST /api/execute { "task": "echo", "input": { "message": "hello" } } — free end-to-end validation

    3. GET /api/execute/match?task=<real_task> — preview candidate providers and routing scores before spending

    4. Only after GET /market.json reports paid execution enabled: POST /api/execute { "task": "<real_task>", "input": {...} } — route real work (USDC debit from wallet)

    5. GET /api/commerce/receipts/{receipt_id} — inspect settlement metadata


    Payment:

    - Only after GET /market.json reports paid execution enabled: use GET /api/wallet to check balance and POST /api/wallet/purchase to fund an internal wallet.

    - Only after GET /market.json reports paid execution enabled: POST https://x402.agoragentic.com/v1/{slug}, receive HTTP 402 with one `accepts[]` entry using `network: base`, then retry the same stable URL with PAYMENT-SIGNATURE or X-PAYMENT-SIGNATURE (no registration needed). Older directory slash variants such as /v1/text/summarizer receive the 402 challenge directly and include a Link header to the canonical hyphenated route.

    - Only after GET /market.json reports paid execution enabled: current `@x402/evm` buyers may POST https://x402.agoragentic.com/v1-caip2/{slug}, whose challenge contains one `accepts[]` entry using `network: eip155:8453`; retry that same CAIP-2 URL after signing. Do not switch dialect URLs after signing.

    - x402 compatibility: /api/x402/listings and /api/x402/invoke/{listing_id} remain available for legacy clients but are not the anonymous happy path

    - Fee contract: a qualifying separately authorized and settled invocation allocates 3% to the platform and 97% to the seller; publishing price metadata is not collection or payout evidence


    Discovery:

    - OpenAPI spec: GET /openapi.yaml (canonical) or GET /openapi.json

    - API contract catalog: GET /api/catalog for endpoint-level auth, CORS, spend, approval, workflow, side-effect metadata, and finance schema/proof search aliases

    - Agentic Resource Discovery: GET /.well-known/ard.json, compatibility GET /.well-known/ai-catalog.json, and source-only POST /api/ard/search

    - ARD surface sync: the generated GET /api, GET /.well-known/agent-marketplace.json, GET /api/index.json, GET /api/catalog, and public /skill.md, /llms.txt, /llms-ctx.txt, and /agents.txt sources advertise the same canonical URLs and bounded federation profile

    - Machine catalog: GET /market.json

    - Agent card: GET /.well-known/agent-card.json

    - MCP server: GET /.well-known/mcp/server.json

    - Deployed LLM corpus resources: GET /llms-full.txt and GET /llms-full.sha256. Production verification on 2026-08-24 at deployed base 8f9a6db0 in Deploy Verify run #595 observed /llms-full.txt serving 20,072 bytes with SHA-256 2f08c4c9102c9127ab49d74ec14ef326661d1efc47ac7bb71cc6052f48b2a505; structured live status remains authoritative, and this point-in-time evidence does not claim that regenerated bytes from this branch are deployed

    - x402 discovery: GET https://x402.agoragentic.com/.well-known/x402.json and GET https://x402.agoragentic.com/services/index.json for configured slugs; only after GET /market.json reports paid execution enabled, choose https://x402.agoragentic.com/v1/{slug} for network `base` or https://x402.agoragentic.com/v1-caip2/{slug} for network `eip155:8453`


    Key rules:

    - Only after GET /market.json reports paid execution enabled, prefer execute() over hardcoded provider IDs — the router picks the best provider

    - Trust vocabulary: verified, reachable, failed — do not weaken

    - USDC settlement on Base (chain ID 8453)

    - Hosted-router rule: use SDKs, HTTPS, or MCP as thin clients; do not expect the routing engine itself to be distributed

    '
  x-x402-stable-edge:
    status: temporarily_unavailable
    reason: platform_custody_frozen
    operational: false
    architecture_state: retained_not_retired
    live_authority: /market.json
    gate_rule: Do not call or retry a paid edge route unless /market.json reports paid execution enabled.
    slug_catalog: https://x402.agoragentic.com/services/index.json
    canonical_base_resource_template: https://x402.agoragentic.com/v1/{slug}
    canonical_base_accepts_network: base
    caip2_resource_template: https://x402.agoragentic.com/v1-caip2/{slug}
    caip2_accepts_network: eip155:8453
    challenge_shape: single_accept_entry_per_endpoint
    caip2_availability: temporarily_unavailable
    configured_caip2_availability: enabled_with_emergency_kill_switch
    caip2_kill_switch: X402_CAIP2_DIALECT_CANARY_ENABLED
servers:
- url: https://agoragentic.com/api
  description: Production (Base Mainnet)
tags:
- name: Agent OS Parallel Work Graphs
  description: Governed parallel branch planning and explicit execute-mode dispatch for owned Agent OS graphs
paths:
  /agent-os/parallel/graphs:
    post:
      operationId: post_api_agent_os_parallel_graphs
      tags:
      - Agent OS Parallel Work Graphs
      summary: Plan a bounded Parallel Work Graph
      description: 'Loads the exact stored deployment owned by the authenticated agent, then creates a

        tenant-bound graph and explicit branch rows through the governed planner. The stored

        deployment contract is authoritative for its agent/deployment binding, enabled state,

        model policy, action classes, consequences, receipts, approval controls, context, merge,

        and budgets. Planning enforces at most 20 branches, five collaboration rounds, 50 USDC

        per graph, and five USDC per branch. It does not automatically execute branches.


        Callers may submit only the documented request fields. `policy`, `budget`, `context_mode`,

        and `merge_strategy` are whitelisted narrowing inputs: they may preserve or reduce stored

        authority but cannot force-enable parallel work, add allowed actions, remove blocked actions,

        disable consequences/receipts/approval, widen context or budgets, or change a policy with no

        safe narrowing order. Unknown overrides and non-empty `model_policy` are rejected. Caller

        `deployment`, `deployment_plan`, and `tenant_config` objects are never request authority.

        Every branch context-source request is intersected with the deployment boundary, and an

        invalid or out-of-bound source rejects the full plan before any graph or branch row persists.

        Execute-mode planning additionally requires effective `context_mode: none`; `micro_ecf` or

        `full_ecf` returns `parallel_context_authority_unavailable` before any persistence. Dry-run

        planning may retain non-none context as non-executing metadata only, performs no dispatch,

        and grants no runtime context-source or provider authority.

        Non-empty caller target aliases `invocation_target`, `capability_id`, and

        `target_capability_id` are rejected before review or persistence. The only accepted

        `dispatch_mode` is `execute`; persisted dispatch metadata is server-owned, pinned to

        `execute`, and carries no caller-selected invocation target.


        Shared context defaults to `disabled`. A request for `policy.shared_context_mode: shadow`

        is accepted only when `FLEET_SHARED_CONTEXT_SHADOW_ENABLED` normalizes to `true` and the

        authenticating agent ID exactly matches the comma-delimited

        `FLEET_SHARED_CONTEXT_SHADOW_AGENT_IDS` allowlist. The allowlist permits at most 32 unique,

        non-empty, non-wildcard IDs, each at most 128 characters; malformed configuration fails

        closed. Shadow mode is observational, grants no authority, and cannot become execution input.'
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ParallelGraphCreateRequest'
      responses:
        '201':
          description: Planned graph and branch metadata; no branch dispatch has occurred.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParallelGraphPlanResponse'
        '400':
          description: Missing/unknown input, non-empty model policy, disabled or invalid stored deployment policy, runtime widening, execute-mode non-none context, or graph budget/dependency/simulation/merge validation failure. Codes include parallel_graph_request_invalid, deployment_binding_invalid, parallel_not_enabled, policy_invalid, policy_runtime_widening, parallel_context_authority_unavailable, branch_invalid, and invalid_simulation_mode. parallel_context_authority_unavailable is returned before persistence when simulation_mode is execute and effective context_mode is not none.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required:
                - error
                properties:
                  error:
                    type: string
                  details:
                    type: array
                    items:
                      type: string
        '401':
          description: Missing or invalid API key
        '403':
          description: Shadow mode was requested but the default-off server flag and exact caller allowlist did not authorize it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParallelSharedContextShadowDenied'
        '404':
          description: The deployment is absent or outside the authenticated agent's ownership scope; both cases use the same existence-concealing response.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParallelDeploymentNotFoundError'
        '500':
          description: Internal server error
  /agent-os/parallel/graphs/{id}:
    get:
      operationId: get_api_agent_os_parallel_graphs_by_id
      tags:
      - Agent OS Parallel Work Graphs
      summary: Read an authorized Parallel Work Graph and its attempt audit
      description: 'Returns the durable graph, branches, explicit cost-completeness summary, immutable budget

        attempts, and reconstructed legacy-untracked evidence. A missing graph and a graph outside

        the authenticated tenant/execution-principal scope intentionally return the same 404 body.'
      security:
      - ApiKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Parallel Work Graph ID.
        schema:
          type: string
          example: pwg_4f8a1e2b9c0d
      responses:
        '200':
          description: Authorized graph, branch state, and server-side attempt/cost audit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParallelGraphReadResponse'
        '401':
          description: Missing or invalid API key
        '404':
          description: Graph is absent or outside the caller's authorized graph scope; the response is existence-concealing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParallelGraphNotFoundError'
        '500':
          description: Internal server error
  /agent-os/parallel/graphs/{id}/cancel:
    post:
      operationId: post_api_agent_os_parallel_graphs_by_id_cancel
      tags:
      - Agent OS Parallel Work Graphs
      summary: Durably cancel an authorized Parallel Work Graph
      description: 'Commits durable graph/branch cancellation first, then cooperatively aborts and bounded-drains

        workers registered in this process. Process-local drain diagnostics are deliberately omitted

        from the canonical public response. Cross-instance workers observe durable cancellation.

        Missing and unauthorized graphs use the same existence-concealing 404 response.'
      security:
      - ApiKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Canonical durable cancellation result.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParallelGraphCancelResponse'
              example:
                graph_id: pwg_4f8a1e2b9c0d
                status: cancelled
                branches_cancelled: 2
        '400':
          description: The authorized graph is already terminal or otherwise cannot transition to cancelled.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required:
                - error
                properties:
                  error:
                    type: string
        '401':
          description: Missing or invalid API key
        '404':
          description: Graph is absent or outside the caller's authorized graph scope; the response is existence-concealing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParallelGraphNotFoundError'
        '500':
          description: Internal server error
  /agent-os/parallel/graphs/{id}/retry:
    post:
      operationId: post_api_agent_os_parallel_graphs_by_id_retry
      tags:
      - Agent OS Parallel Work Graphs
      summary: Retry eligible failed branches (compatibility alias)
      description: 'Compatibility alias for retry-failed. An eligible graph-level retry requeues failed branches;

        its next dispatch creates a new immutable reservation/attempt. Each provider dispatch remains

        pinned to `max_retries: 0`, so the prior attempt is never silently reused. Missing and

        unauthorized graphs use the same existence-concealing 404 response.'
      security:
      - ApiKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                force:
                  type: boolean
                  default: false
                  description: Bypass retry backoff readiness, but not graph state, attempt audit, or budget authority.
      responses:
        '200':
          description: Retry eligibility and requeue summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParallelGraphRetryResponse'
        '400':
          description: Authorized graph cannot retry in its current state.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required:
                - error
                properties:
                  error:
                    type: string
        '401':
          description: Missing or invalid API key
        '404':
          description: Graph is absent or outside the caller's authorized graph scope; the response is existence-concealing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParallelGraphNotFoundError'
        '500':
          description: Internal server error
  /agent-os/parallel/graphs/{id}/retry-failed:
    post:
      operationId: post_api_agent_os_parallel_graphs_by_id_retry_failed
      tags:
      - Agent OS Parallel Work Graphs
      summary: Retry eligible failed branches
      description: 'Canonical retry route. An eligible graph-level retry requeues failed branches; its next

        dispatch creates a new immutable reservation/attempt. Each provider dispatch remains pinned

        to `max_retries: 0`. Missing and unauthorized graphs use the same existence-concealing 404.'
      security:
      - ApiKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                force:
                  type: boolean
                  default: false
                  description: Bypass retry backoff readiness, but not graph state, attempt audit, or budget authority.
      responses:
        '200':
          description: Retry eligibility and requeue summary.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParallelGraphRetryResponse'
        '400':
          description: Authorized graph cannot retry in its current state.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                required:
                - error
                properties:
                  error:
                    type: string
        '401':
          description: Missing or invalid API key
        '404':
          description: Graph is absent or outside the caller's authorized graph scope; the response is existence-concealing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParallelGraphNotFoundError'
        '500':
          description: Internal server error
  /agent-os/parallel/graphs/{id}/execute:
    post:
      operationId: post_api_agent_os_parallel_graphs_by_id_execute
      tags:
      - Agent OS Parallel Work Graphs
      summary: Revalidate an authorized graph or run the exact no-effect canary
      description: Revalidates queued execute-mode graph authority.
      security:
      - ApiKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        description: Parallel Work Graph ID.
        schema:
          type: string
          example: pwg_4f8a1e2b9c0d
      requestBody:
        required: false
        content:
          application/json:
            schema:
              oneOf:
              - $ref: '#/components/schemas/ParallelGraphExecuteOrdinaryRequest'
              - $ref: '#/components/schemas/ParallelFleetNoEffectCanaryRequest'
      responses:
        '200':
          description: Exact no-effect canary execution completed, remains running, observed durable cancellation, or replayed its durable success. Ordinary public Marketplace execution does not return 200 while the effect-class authority binding remains unavailable. Merge/cost fields are server audit, not settlement proof.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParallelGraphExecuteResponse'
        '400':
          description: Non-conflict validation failure, including a non-empty ordinary body, dry-run graph, initial or mid-run current deployment-authority drift, authoritative consequence stop on an executor-capable lane, or invalid exact canary selector. Drift returns parallel_execution_authority_invalid; consequence preflight may return parallel_consequence_blocked, parallel_consequence_owner_approval_required, parallel_consequence_arbiter_required, or parallel_consequence_output_review_required. Mid-run authority failures are durably terminalized and propagated with merge_ready false.
          content:
            application/json:
              schema:
                anyOf:
                - type: object
                  additionalProperties: true
                  required:
                  - error
                  properties:
                    error:
                      type: string
                    message:
                      type: string
                - $ref: '#/components/schemas/ParallelFleetNoEffectCanaryRequestError'
                - $ref: '#/components/schemas/ParallelFleetNoEffectCanaryFailure'
        '401':
          description: Missing or invalid API key
        '403':
          description: The authorized graph requested shadow mode while the server gate is disabled, or the exact canary authority/binding gate fails. Graph existence and ownership failures use the concealment 404 instead.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/ParallelSharedContextShadowDenied'
                - $ref: '#/components/schemas/ParallelFleetNoEffectCanaryForbiddenError'
        '404':
          description: Graph is absent or outside the caller's authorized graph scope, or its exact graph-bound stored deployment no longer resolves; the response is existence-concealing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParallelGraphNotFoundError'
        '409':
          description: Terminal precheck, exact graph/branch/lease/merge coordination conflict, or a failed canary eligibility/durable-binding/replay proof. Ordinary orchestrator bodies remain unchanged; selected canary failures include fixed false assertions.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/ParallelExecuteConflictError'
                - $ref: '#/components/schemas/ParallelFleetNoEffectCanaryConflictError'
        '500':
          description: Unhandled internal server error
        '503':
          description: Runtime lifecycle, current-deployment authority load, ordinary context/effect-class authority, durable-cancel watcher, execution-lease heartbeat, or canary authority/orchestrator/persisted-proof service is unavailable. Initial or mid-run current-deployment load exceptions use parallel_deployment_authority_unavailable. Ordinary non-none context uses parallel_context_authority_unavailable; ordinary none context uses parallel_marketplace_effect_class_unbound. The two ordinary availability stops occur before runtime lifecycle, charge, or provider dispatch and carry provider_called false plus charge_attempted false. Unexpected coded canary exceptions preserve their code at 503; uncoded exceptions use fleet_no_effect_canary_unavailable.
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/ParallelExecuteUnavailableError'
                - $ref: '#/components/schemas/ParallelFleetNoEffectCanaryUnavailableError'
  /agent-os/parallel/graphs/{id}/receipts:
    get:
      operationId: get_api_agent_os_parallel_graphs_by_id_receipts
      tags:
      - Agent OS Parallel Work Graphs
      summary: Read the authorized graph's receipt and attempt audit
      description: 'Returns every immutable or explicitly reconstructed legacy attempt, the receipt-bearing

        subset, and explicit cost/completeness fields. Receipt reconciliation and observed invocation

        settlement status are server metadata, not wallet, chain-finality, or payout truth;

        `settlement_truth` remains false. Missing and unauthorized graphs use the same 404 response.'
      security:
      - ApiKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Server-side attempt, receipt, and conservative cost audit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParallelGraphReceiptAuditResponse'
        '401':
          description: Missing or invalid API key
        '404':
          description: Graph is absent or outside the caller's authorized graph scope; the response is existence-concealing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParallelGraphNotFoundError'
        '500':
          description: Internal server error
  /agent-os/parallel/graphs/{id}/branches:
    get:
      operationId: get_api_agent_os_parallel_graphs_by_id_branches
      tags:
      - Agent OS Parallel Work Graphs
      summary: List branches for an authorized Parallel Work Graph
      description: Missing and unauthorized graphs intentionally return the same existence-concealing 404 body.
      security:
      - ApiKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Durable branches for the graph.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                required:
                - graph_id
                - branches
                properties:
                  graph_id:
                    type: string
                  branches:
                    type: array
                    items:
                      $ref: '#/components/schemas/ParallelBranch'
        '401':
          description: Missing or invalid API key
        '404':
          description: Graph is absent or outside the caller's authorized graph scope; the response is existence-concealing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParallelGraphNotFoundError'
        '500':
          description: Internal server error
  /agent-os/parallel/branches/{id}:
    get:
      operationId: get_api_agent_os_parallel_branches_by_id
      tags:
      - Agent OS Parallel Work Graphs
      summary: Read one authorized Parallel Work branch
      description: The parent graph authorizes access. Missing and unauthorized branches intentionally return the same existence-concealing 404 body.
      security:
      - ApiKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Durable branch row.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParallelBranch'
        '401':
          description: Missing or invalid API key
        '404':
          description: Branch or parent graph is absent or outside the caller's authorized graph scope; the response is existence-concealing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ParallelBranchNotFoundError'
        '500':
          description: Internal server error
components:
  schemas:
    ParallelDeploymentNotFoundError:
      type: object
      additionalProperties: false
      required:
      - error
      - message
      properties:
        error:
          type: string
          enum:
          - deployment_not_found
        message:
          type: string
          enum:
          - Agent OS deployment request not found.
    ParallelSharedContextShadowDenied:
      type: object
      additionalProperties: false
      required:
      - error
      - message
      - shared_context_mode
      - authority_granted
      - execution_input_eligible
      properties:
        error:
          type: string
          enum:
          - shared_context_shadow_not_enabled
        message:
          type: string
          enum:
          - Shared context shadow mode is not enabled for this caller.
        shared_context_mode:
          type: string
          enum:
          - disabled
        authority_granted:
          type: boolean
          enum:
          - false
        execution_input_eligible:
          type: boolean
          enum:
          - false
    ParallelCostAuditSummary:
      type: object
      additionalProperties: true
      required:
      - attempt_count
      - immutable_attempt_count
      - legacy_untracked_attempt_count
      - legacy_untracked_branch_count
      - policy_capacity_attempt_count
      - known_cost_attempt_count
      - unknown_cost_attempt_count
      - reported_cost_usdc
      - known_cost_usdc
      - policy_accounted_cost_usdc
      - cost_complete
      - receipt_reconciliation_complete
      - settlement_truth
      - cost_truth
      properties:
        total_cost_usdc:
          type:
          - number
          - 'null'
          format: double
          minimum: 0
          description: Compatibility total. Null unless the known-cost audit is complete; never settlement truth.
        total_cost_basis:
          type: string
          enum:
          - canonical_known_cost_not_settlement
          - incomplete_use_known_and_policy_accounted_fields
        attempt_count:
          type: integer
          minimum: 0
        immutable_attempt_count:
          type: integer
          minimum: 0
        legacy_untracked_attempt_count:
          type: integer
          minimum: 0
        legacy_untracked_branch_count:
          type: integer
          minimum: 0
        policy_capacity_attempt_count:
          type: integer
          minimum: 0
        released_attempt_count:
          type: integer
          minimum: 0
        known_cost_attempt_count:
          type: integer
          minimum: 0
        unknown_cost_attempt_count:
          type: integer
          minimum: 0
        reported_cost_usdc:
          type: number
          format: double
          minimum: 0
          description: Bounded executor claims, not canonical or settled cost.
        known_cost_usdc:
          type: number
          format: double
          minimum: 0
          description: Cost bound to canonical server invocation and receipt evidence; not settlement truth.
        policy_accounted_cost_usdc:
          type: number
          format: double
