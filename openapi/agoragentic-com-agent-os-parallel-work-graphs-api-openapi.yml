      properties:
        error:
          type: string
          enum:
          - Graph not found.
    ParallelFleetNoEffectCanaryUnavailableError:
      allOf:
      - $ref: '#/components/schemas/ParallelFleetNoEffectCanaryFailure'
      - type: object
        required:
        - error
        properties:
          error:
            type: string
            minLength: 1
            description: Known canary availability codes are enumerated first. An unexpected exception with a non-empty code preserves that code at 503; an uncoded exception becomes fleet_no_effect_canary_unavailable. Shared runtime/lifecycle 503 codes also remain possible.
            anyOf:
            - enum:
              - fleet_no_effect_canary_database_required
              - fleet_no_effect_canary_authority_check_required
              - fleet_no_effect_canary_guard_operation_required
              - fleet_no_effect_canary_admission_not_proven
              - fleet_no_effect_canary_orchestrator_required
              - fleet_no_effect_canary_persisted_proof_invalid
              - fleet_no_effect_canary_unavailable
              - graph_execution_lifecycle_exists
              - graph_execution_session_stale
              - parallel_durable_cancel_watcher_unavailable
              - parallel_deployment_authority_unavailable
              - parallel_graph_execution_lease_heartbeat_unavailable
              - parallel_runtime_stopping
            - type: string
              minLength: 1
    ParallelGraphExecuteResponse:
      type: object
      additionalProperties: true
      required:
      - graph_id
      - status
      - merge_ready
      properties:
        graph_id:
          type: string
        status:
          type: string
          enum:
          - running
          - succeeded
          - failed
          - cancelled
          - partially_succeeded
        execution:
          type:
          - object
          - 'null'
          additionalProperties: true
          properties:
            branches_run:
              type: integer
              minimum: 0
            dependencies_released:
              type: integer
              minimum: 0
            dependencies_blocked:
              type: integer
              minimum: 0
            results:
              type: array
              items:
                type: object
                additionalProperties: true
        merge_ready:
          type: boolean
        merge_result:
          allOf:
          - $ref: '#/components/schemas/ParallelMergeResult'
        no_effect_canary:
          oneOf:
          - $ref: '#/components/schemas/ParallelFleetNoEffectCanaryProof'
          - $ref: '#/components/schemas/ParallelFleetNoEffectRetentionCanaryProof'
    ParallelMergeResult:
      type: object
      additionalProperties: true
      properties:
        verdict:
          type: string
        total_cost_usdc:
          type:
          - number
          - 'null'
          format: double
          minimum: 0
          description: Compatibility total populated only for a complete canonical known-cost audit; not settlement truth.
        total_cost_basis:
          type: string
          enum:
          - canonical_known_cost_not_settlement
          - incomplete_use_known_and_policy_accounted_fields
        known_cost_usdc:
          type:
          - number
          - 'null'
          format: double
          minimum: 0
        reported_cost_usdc:
          type:
          - number
          - 'null'
          format: double
          minimum: 0
        policy_accounted_cost_usdc:
          type: number
          format: double
          minimum: 0
        cost_complete:
          type: boolean
        unknown_cost_attempt_count:
          type: integer
          minimum: 0
        legacy_untracked_attempt_count:
          type: integer
          minimum: 0
        receipt_reconciliation_complete:
          type: boolean
        settlement_truth:
          type: boolean
          enum:
          - false
        cost_truth:
          type: string
          enum:
          - incomplete_legacy_and_server_invocation_audit
          - policy_and_internal_no_effect_receipt_audit_only
          - policy_and_mixed_server_binding_audit_only
          - policy_and_server_invocation_audit_only
        cost_summary:
          $ref: '#/components/schemas/ParallelCostAuditSummary'
        receipts:
          type: array
          items:
            $ref: '#/components/schemas/ParallelBudgetAttempt'
    ParallelGraphRetryResponse:
      type: object
      additionalProperties: true
      required:
      - graph_id
      - retried
      - delayed
      - exhausted
      properties:
        graph_id:
          type: string
        retried:
          type: integer
          minimum: 0
        delayed:
          type: integer
          minimum: 0
        exhausted:
          type: integer
          minimum: 0
        retry_after_ms:
          type:
          - integer
          - 'null'
          minimum: 0
        branches:
          type: array
          items:
            type: object
            additionalProperties: true
    ParallelGraphReceiptAuditResponse:
      type: object
      additionalProperties: false
      required:
      - graph_id
      - receipts
      - attempts
      - cost_summary
      properties:
        graph_id:
          type: string
        receipts:
          type: array
          description: Receipt-bearing subset of attempts; not a payment-settlement ledger.
          items:
            $ref: '#/components/schemas/ParallelBudgetAttempt'
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/ParallelBudgetAttempt'
        cost_summary:
          $ref: '#/components/schemas/ParallelCostAuditSummary'
    ParallelFleetNoEffectCanaryProof:
      type: object
      additionalProperties: false
      required:
      - schema
      - mode
      - verified
      - receipt_ref
      - result_hash
      - fleet_source_succeeded
      - fleet_attempt_count
      - accepted_admission_count
      - cost_basis
      - cost_usdc
      - cost_complete
      - receipt_reconciliation_complete
      - settlement_truth
      - no_effect
      - provider_called
      - model_called
      - remote_worker_called
      - network_called
      - outbound_dispatch_attempted
      - tool_called
      - wallet_accessed
      - payment_attempted
      - settlement_attempted
      - publication_attempted
      - trust_mutation_attempted
      - deployment_attempted
      - external_write_attempted
      - authority_granted
      - execution_input_eligible
      - replayed
      description: Durable proof for one deterministic, server-owned, zero-budget internal candidate and receipt. It is not provider execution, wallet/payment/settlement truth, publication, deployment, activation, or authority.
      properties:
        schema:
          type: string
          enum:
          - agoragentic.parallel-fleet-no-effect-canary-proof.v1
        mode:
          type: string
          enum:
          - no_effect_v1
        verified:
          type: boolean
          enum:
          - true
        receipt_ref:
          type: string
          minLength: 1
        result_hash:
          type: string
          minLength: 1
        fleet_source_succeeded:
          type: boolean
          enum:
          - true
        fleet_attempt_count:
          type: integer
          enum:
          - 1
        accepted_admission_count:
          type: integer
          enum:
          - 1
        cost_basis:
          type: string
          enum:
          - internal_no_effect_receipt_bound
        cost_usdc:
          type: number
          enum:
          - 0
        cost_complete:
          type: boolean
          enum:
          - true
        receipt_reconciliation_complete:
          type: boolean
          enum:
          - true
        settlement_truth:
          type: boolean
          enum:
          - false
        no_effect:
          type: boolean
          enum:
          - true
        provider_called:
          type: boolean
          enum:
          - false
        model_called:
          type: boolean
          enum:
          - false
        remote_worker_called:
          type: boolean
          enum:
          - false
        network_called:
          type: boolean
          enum:
          - false
        outbound_dispatch_attempted:
          type: boolean
          enum:
          - false
        tool_called:
          type: boolean
          enum:
          - false
        wallet_accessed:
          type: boolean
          enum:
          - false
        payment_attempted:
          type: boolean
          enum:
          - false
        settlement_attempted:
          type: boolean
          enum:
          - false
        publication_attempted:
          type: boolean
          enum:
          - false
        trust_mutation_attempted:
          type: boolean
          enum:
          - false
        deployment_attempted:
          type: boolean
          enum:
          - false
        external_write_attempted:
          type: boolean
          enum:
          - false
        authority_granted:
          type: boolean
          enum:
          - false
        execution_input_eligible:
          type: boolean
          enum:
          - false
        replayed:
          type: boolean
          description: False for the first execution response; true only after persisted proof is revalidated on a succeeded-graph replay.
    ParallelGraphReadResponse:
      type: object
      additionalProperties: true
      required:
      - id
      - status
      - branches
      - cost_summary
      - budget_attempts
      - legacy_untracked_attempts
      properties:
        id:
          type: string
        deployment_id:
          type: string
        agent_id:
          type:
          - string
          - 'null'
        owner_id:
          type:
          - string
          - 'null'
        execution_principal_id:
          type:
          - string
          - 'null'
        status:
          type: string
        total_cost_usdc:
          type:
          - number
          - 'null'
          format: double
          minimum: 0
          description: Nullable compatibility field. Use cost_summary completeness and explicit cost fields.
        branches:
          type: array
          items:
            $ref: '#/components/schemas/ParallelBranch'
        cost_summary:
          $ref: '#/components/schemas/ParallelCostAuditSummary'
        budget_attempts:
          type: array
          description: Immutable reservation/attempt rows created by the atomic dispatch transition.
          items:
            $ref: '#/components/schemas/ParallelBudgetAttempt'
        legacy_untracked_attempts:
          type: array
          description: Conservative reconstructed evidence for execution predating immutable attempt audit.
          items:
            $ref: '#/components/schemas/ParallelBudgetAttempt'
  securitySchemes:
    ApiKeyAuth:
      x-agoragentic-permissions:
        credential_model: agent_account_key
        oauth_scopes_supported: false
        wallet_policy_endpoint: /api/wallet/policy
        wallet_policy_is_route_acl: false
        documentation: https://agoragentic.com/developers/agent-access.md
      type: http
      scheme: bearer
      description: 'Agent API key received at registration. Pass as ''Authorization: Bearer amk_...'''
    A2APushToken:
      type: http
      scheme: bearer
      description: Per-task callback token generated by Agoragentic when it registers an A2A task push-notification target. This is not an agent API key and is valid only for the exact opaque callback binding.
    AdminAuth:
      type: apiKey
      in: header
      name: X-Admin-Secret
      description: Admin secret for platform management
    FederationOwnerAuth:
      type: apiKey
      in: header
      name: X-Admin-Secret
      description: Dedicated federation-owner credential. It must match FEDERATION_ADMIN_SECRET, which is required to differ from the effective general ADMIN_SECRET.
    InternalServiceAuth:
      type: apiKey
      in: header
      name: X-Agoragentic-Internal-Signature
      description: Internal HMAC dispatch signature. Not issued to external clients. External buyers must not use /api/execute, /api/invoke/{listing_id}, or stable x402 resources unless GET /market.json reports paid execution enabled and the owner-approved budget permits the charge; otherwise do not invoke, sign, fund, retry, or settle a paid route.
