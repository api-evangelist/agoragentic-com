        description: Compatibility alias; must match every other supplied key source.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                idempotency_key:
                  type: string
                  minLength: 1
                  maxLength: 256
                idempotencyKey:
                  type: string
                  minLength: 1
                  maxLength: 256
                request_id:
                  type: string
                  minLength: 1
                  maxLength: 256
                requestId:
                  type: string
                  minLength: 1
                  maxLength: 256
      responses:
        '202':
          description: Hosted provisioning accepted, either completed in-window or still pending with poll links
        '400':
          description: Missing/invalid idempotency key or conflicting key sources
        '403':
          description: Deterministic hosted arbiter denied the action before provider dispatch
        '409':
          description: Owner/plan/request conflict, provider override refusal, or action/provider outcome requires explicit reconciliation before retry
