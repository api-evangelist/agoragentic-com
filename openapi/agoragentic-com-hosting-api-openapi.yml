  /hosting/agent-os/deployments/{id}/runtime/invoke:
    post:
      operationId: post_api_hosting_agent_os_deployments_by_id_runtime_invoke
      tags:
      - Hosting
      summary: Invoke an Agent OS runtime through the owner proxy
      description: Owner-authenticated platform-hosted runtime `/invoke` proxy. Native upstream calls use deployment-scoped HMAC v3 and bind owner, agent, deployment, credential version/state, nonce, action request ID, method, path, timestamp, and the exact serialized body; there is no shared owner-proxy fallback. The server strips caller model controls, derives a hard model/token/cost ceiling from persisted deployment policy, and requires one deployment-shared durable execution claim. The runtime validates authentication, JSON, and inference control before claiming, then records execution start under a token/generation fence before provider work. Never-started expired leases may be reissued; started expired leases require evidence-bound operator recovery and cannot blindly reexecute. Provider-backed success requires request-bound adapter evidence that the exact model and token ceilings were applied; usage below the cap alone is not proof. The deterministic no-provider path reports zero usage without claiming provider ceiling enforcement. A provider failure retains proven usage/cost when present or reports explicit usage uncertainty with null actuals. Credentials, secret references, raw provider evidence, and credential-bearing URLs are excluded from payloads, responses, audit details, analytics, and receipts. Responses are streamed with a hard 256 KiB cap and bounded JSON structure. This does not publish a listing or create anonymous marketplace traffic. Missing, revoked, unsupported, malformed, or replay-protection-unavailable runtime state fails closed.
      security:
      - ApiKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Runtime invoke returned
        '403':
          description: Deployment-scoped runtime proxy credential is revoked
        '409':
          description: Model route blocked, action request ID conflicts with a different payload, runtime proxy auth is not configured, runtime is not ready, proxy is unsupported, or stored runtime URL is invalid
        '413':
          description: Request body exceeds the 256 KiB API limit
        '502':
          description: Runtime request failed, returned malformed or oversized JSON, lacked request-bound provider evidence, or reflected sensitive material
        '504':
          description: Runtime request timed out
