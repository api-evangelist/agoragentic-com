  /hosting/agent-os/deployments/{id}/activate:
    post:
      operationId: post_api_hosting_agent_os_deployments_by_id_activate
      tags:
      - Hosting
      summary: Evaluate hosted activation for an Agent OS deployment
      description: 'Evaluates the activation gate before any provider call, then dispatches only the immutable

        operator-approved provider projection behind the deployment-wide provider-effect fence.

        Nested provider_state and caller-supplied adapter controls are rejected. After fulfillment

        review, smoke, and intent reconciliation pass, the exposure arbiter may keep the runtime

        private, expose a public runtime API, create/update a review-gated marketplace candidate,

        or request x402 exposure. Pending/blocked candidates do not receive live direct-invoke or

        x402 compatibility invoke metadata.


        Activation requires provider status `runtime_ready_for_marketplace_activation`, service

        status `RUNNING`, `READY`, or `ACTIVE`, runtime trust `reachable` or `verified`, and a valid

        public HTTPS service URL. Marketplace publication separately requires a supported pricing

        model and either price zero or the immutable paid listing floor. The persisted listing draft

        is validated before the activation provider effect: omitted model defaults to `per_call`,

        omitted activation price defaults to exact `0` (distinct from preview/create''s `0.01`),

        numeric/string zero is allowed, and malformed/non-decimal strings, positive-string underflow,

        alias conflict, or a positive price below `0.01` returns typed HTTP 400. A successful activation

        reports `activated=true`, but a new or review-content-changed listing is active/pending,

        requires semantic review plus owner release, and queues no sandbox run yet. Only an exact-

        identity unchanged already approved listing preserves approval and queues canonical

        reverification. Both remain `execution_eligible=false` until current proof passes. Detail,

        list, and completed-effect replay presentation is hydrated from the canonical listing.

        For x402 exposure, `compatibility_invoke_path` remains null and stable-edge status is

        `x402_listing_pending` or `x402_listing_blocked` until the canonical listing is effective;

        only then can a live compatibility status be returned.


        A non-ready provider result is a completed replayable outcome: HTTP 202, `success=false`,

        `activated=false`, readiness details, no listing, and marketplace verification

        `not_requested`. An existing bound listing may be republished only while seller-owned,

        hosted/platform-hosted, exactly active/approved, and unchanged from its evidence snapshot.

        Paused or reviewer/lifecycle/revision-changed rows are preserved and return the same negative

        shape at HTTP 409; hosting never autoapproves or silently resumes them. Exact completed

        effects replay without another provider call; uncertain effects require reconciliation.'
      security:
      - ApiKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      - name: Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 256
        description: Required here or through an identical JSON-body key alias.
      - name: X-Idempotency-Key
        in: header
        required: false
        schema:
          type: string
          minLength: 1
          maxLength: 256
        description: Compatibility alias; must match every other supplied key source.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
              properties:
                idempotency_key:
                  type: string
                  minLength: 1
                  maxLength: 256
                idempotencyKey:
                  type: string
                  minLength: 1
                  maxLength: 256
                request_id:
                  type: string
                  minLength: 1
                  maxLength: 256
                requestId:
                  type: string
                  minLength: 1
                  maxLength: 256
      responses:
        '202':
          description: Hosted activation completed in-window (activated or honestly blocked), or reviewed work remains pending with poll links
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/HostedActivationOutcome'
                - $ref: '#/components/schemas/ReviewedHostedPendingOutcome'
                - $ref: '#/components/schemas/Error'
        '400':
          description: Missing/invalid idempotency key, conflicting key sources, invalid hosted endpoint, unsupported pricing model, or invalid/conflicting/below-floor paid price
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/HostedListingEconomicsError'
                - $ref: '#/components/schemas/Error'
        '403':
          description: Deterministic hosted arbiter denied the action
        '409':
          description: Existing hosted listing state/revision was preserved, or another owner/plan/effect/reconciliation conflict blocked activation
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/HostedActivationOutcome'
                - $ref: '#/components/schemas/Error'
