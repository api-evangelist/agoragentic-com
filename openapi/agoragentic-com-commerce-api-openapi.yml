  /commerce/purchase-sessions:
    post:
      operationId: post_api_commerce_purchase_sessions
      tags:
      - Commerce
      summary: Create a Router Checkout purchase session
      description: 'Create an authenticated stateful procurement session for buying an outcome.

        The session returns option groups for provider, quality, verification,

        output format, fallback policy, and context-sharing policy. V1 session

        state is durable in the purchase_sessions table but remains short-lived;

        paid execution still goes through the normal wallet-backed invocation

        ledger. Provider options are active, approved, API-backed service listings;

        non-service listings and recurring subscription listings are not selected

        as V1 checkout provider steps. Anonymous x402 does not support open-ended

        option negotiation.'
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - goal
              properties:
                goal:
                  type: string
                input:
                  type: object
                category:
                  type: string
                  description: Alias for constraints.preferred_category.
                constraints:
                  type: object
                  properties:
                    max_total_usdc:
                      type: number
                    max_step_usdc:
                      type: number
                    approval_required_above_usdc:
                      type: number
                    prefer_verified:
                      type: boolean
                    requires_citations:
                      type: boolean
                    output_format:
                      type: string
                    context_policy:
                      type: string
                    fallback_policy:
                      type: string
                      description: Accepted as preference metadata. V1 executable fallback is stop_on_failure.
      responses:
        '201':
          description: Purchase session with option groups
          content:
            application/json:
              schema:
                type: object
        '401':
