  /commerce/interchange/admin/sync-sources:
    get:
      operationId: get_api_commerce_interchange_admin_sync_sources
      tags:
      - Commerce
      summary: Discovery sync sources and status (admin only)
      description: 'Returns configured allowlist sources, synced source state, scheduler state, freshness alarms, and current-versus-historical resource counts. Readiness is scoped to source IDs currently enabled in the owner-reviewed allowlist. Every enabled source must exist, be active, have last_sync_status=ok, have a sync timestamp within the stale threshold, and have at least one fresh non-stale resource. Historical/quarantined rows and rows outside the enabled source set remain visible but do not alarm by themselves. Current counts are exposed as external_resources, stale_resources, blocked_historical_resources, and resources_past_stale_threshold; all-row history is exposed separately as historical_external_resources, historical_stale_resources, and resources_outside_enabled_sources. Live sync is disabled by default through INTERCHANGE_DISCOVERY_SYNC_ENABLED. The recurring loop is separately owner-gated through INTERCHANGE_DISCOVERY_SYNC_SCHEDULER_ENABLED. Scheduler status includes tick_in_flight for the synchronous pre-checkout overlap guard. The top-level execution_guard is a distinct all-caller boundary: scheduler, admin, CLI, canary, Cartographer projection, and dry-run definition writes share a synchronous process claim and PostgreSQL session advisory execution lease. Per-source sync reports expose durable run IDs, exact-run absence-stale counts, and source-definition invalidations. The recurring loop must stay off in production until the PostgreSQL advisory-lock leader guard is deployed and the descriptor reports leader_guard.kind=postgres_advisory_lock with available=true. The owner-reviewed JSON config is validated as one unit before any outbound call: `sources` must be an array; every entry must be a non-null, non-array object with a required normalized ID unique after normalization, a non-empty `name`, a supported `kind` (`x402_index`, `mcp_registry`, `manual_export`, `a2a_card`, or `global_a2a_registry`), an allowed credential-free HTTP(S) `url` (HTTPS in deployed runtime; `http://127.0.0.1` only in tests), and a strictly boolean `enabled` value. Optional `min_sync_interval_ms` must be an integer from 900000 through 518400000. The six-day upper bound leaves a full-day margin before the seven-day resource-staleness threshold. The shared runner enforces it before any fetch across scheduled, admin, CLI, canary, and dry-run callers; a not-yet-due source reports `skipped: true`, `skip_reason: source_minimum_interval_not_elapsed`, and `next_eligible_at` without making an external call or replacing live proof. These are the source-definition fields for every current kind. One invalid entry fails the whole config as the bounded `sources_config_invalid` error instead of being skipped or defaulted.'
      security:
      - AdminAuth: []
      responses:
        '200':
          description: Configured and synced source lists with enabled-source health
          exact current/history counts: null
          and leader-guard scheduler status: null
        '403':
          description: Admin secret required
  /commerce/interchange/admin/sync:
    post:
      operationId: post_api_commerce_interchange_admin_sync
      tags:
      - Commerce
      summary: Run discovery sync (admin only; dry-run by default)
      description: 'Runs external-catalog discovery against enabled sources in the owner-approved allowlist. The request is dry-run unless dry_run is false and INTERCHANGE_DISCOVERY_SYNC_ENABLED permits live sync; blocked live attempts return 409. Before selecting or fetching a source, the complete config must pass the source-object, normalized unique-ID, supported-kind, required-field, allowed-URL, and boolean-enabled contract described by `/commerce/interchange/admin/sync-sources`. Any invalid entry blocks the whole run with `failure_code: sources_config_invalid`, `mode: blocked`, and `external_calls_made: false`; no entry is silently skipped or defaulted. Dry-run performs bounded external catalog GETs only for cadence-due sources, except `global_a2a_registry`, whose upstream request budget is reserved for live runs and whose dry-run reports `source_live_only_bounded_fetch` without a GET. Dry-run updates allowlisted source registration metadata and writes an audit event, but imports or refreshes no resource rows, calls no provider, spends nothing, and mutates no listing or trust state. Name-only edits preserve prior live proof. A same-ID kind or URL change invalidates that proof and marks prior source resources stale even in dry-run, requiring a successful live sync under the new definition. Each source kind requires its explicit catalog list shape; a legitimate empty list succeeds, while an ambiguous HTTP-200 object is a source error. MCP normalization accepts legacy flat entries and current `{server, _meta}` Registry wrappers; it retains only bounded names, descriptions, and the first safe credential-free HTTPS remote endpoint while discarding wrapper metadata, package configuration, headers, and credential material. Global A2A Registry live attempts are reserved before network I/O, capped at one request per 24 hours and 50 records, retain only sanitized provenance/discovery/trap-scan evidence in durable Interchange events, and never infer contact, invoke, trust, routing, referral, provider, or money authority. A bounded first page is marked `snapshot_complete: false`; it refreshes seen rows but cannot mark unseen prior rows absent. These metadata-only cards are excluded from the x402 Router bridge candidate query before its SQL limit. Every successful live fetch/normalize run assigns a durable per-source run token. Complete source snapshots mark prior rows absent from that exact run stale, including after a successful empty catalog; bounded partial snapshots do not. Fetch, shape, normalization, or persistence errors return no successful run ID, preserve absent prior rows/tokens and last-successful proof, skip exact-absence finalization, and record a non-ok source status. Scheduled looping is separately owner-gated. Every caller shares a synchronous execution claim before PostgreSQL pool checkout plus a session advisory execution lease; overlapping admin, CLI, canary, Cartographer, dry-run, and scheduled calls return mode=blocked before fetch or definition/finalization writes. Scheduled runs additionally hold a distinct session advisory leader lock so only one horizontally scaled timer leads. Standalone CLI/canary entrypoints run pending migrations before sync-table access; the discovery CLI sends migration progress to stderr so stdout remains one JSON report. Stale enabled sources, an absent/dry-run loop, a non-PostgreSQL leader guard, a blocked most-recent scheduled execution, or a scheduler error are surfaced through /api/commerce/interchange and /api/health. Retained stale history alone does not alarm, and synced cards never become eligible for invocation binding.'
      security:
      - AdminAuth: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                dry_run:
                  type: boolean
                  default: true
                source_ids:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Sync report with per-source counts
        '403':
          description: Admin secret required
        '409':
          description: Sync blocked by the live-sync env gate, an invalid source config, or another serialized sync caller; blocked config reports make zero outbound calls.
