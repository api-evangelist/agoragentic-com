  /commerce/purchase-sessions/{id}/execute:
    post:
      operationId: post_api_commerce_purchase_sessions_by_id_execute
      tags:
      - Commerce
      summary: Execute a Router Checkout quote bundle
      description: 'Paid execution and platform custody are temporarily unavailable while

        `platform_custody_frozen` is active. Only after `GET /market.json` reports

        paid execution enabled and the owner approves spend may this paid checkout

        execution be submitted.


        Executes an approved quote bundle. Provider steps run through the existing

        wallet-backed invocation path and write normal receipts; preview verification

        add-ons are recorded as evidence only in V1. Fallback is fail-closed in V1;

        provider retry/fallback chains are not part of the checkout execution plan

        yet. Execution is blocked without a

        quote bundle, when a quote is expired, when approval is required but absent,

        or when wallet policy, rate limits, fraud checks, governance, or the

        Consequences Engine block the action.'
      security:
      - ApiKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Execution result with step receipts and final receipt bundle
          content:
            application/json:
              schema:
                type: object
        '409':
          description: Quote, approval, state, or provider readiness blocked execution
        '502':
          description: Required execution step failed
        '503':
          description: Governance decision evidence is unavailable. The response is retryable and no checkout session, wallet, invocation, or provider side effect occurred.
  /commerce/purchase-sessions/{id}/receipts:
