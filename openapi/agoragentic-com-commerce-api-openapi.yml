      summary: Cancel a Router Checkout purchase session
      description: Cancels a session before execution. Executing or terminal sessions cannot be cancelled.
      security:
      - ApiKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
