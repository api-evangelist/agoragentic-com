  /commerce/interchange/plans/{id}/advance:
    post:
      operationId: post_api_commerce_interchange_plans_by_id_advance
      tags:
      - Commerce
      summary: Advance a transaction plan one state with gate checks
      description: 'No-spend planning and deterministic plan transitions remain available

        while `platform_custody_frozen` is active, but a configured x402 token or

        paid-invocation instruction returned by a transition is not current

        execution authority. Only after `GET /market.json` reports paid execution

        enabled and the owner approves spend may such a token be claimed or bound

        through a paid x402 route.


        Advances exactly one state. Each transition runs a deterministic

        gate: marketplace eligibility (trust state `verified`/`reachable`),

        real listing-backed quote with string-only money and expiry,

        owner-approved signed mandate, budget policy (per-call/daily/total),

        payment preparation, real-invocation evidence binding, validation,

        settlement evidence, receipt minting, and reconciliation. For

        `internal_balance`, payment preparation performs a read-only buyer

        balance check. For `x402_per_request`, it re-evaluates the live listing

        with the shared main-domain x402 availability contract, requires a

        positive paid price, and binds exact amount, USDC currency, pricing

        model, quote listing hash, recomputed listing digest, quote/preparation

        refs, fresh evidence ref, runtime signal, and check time without moving

        funds. `transition.x402_execution.token` returns a one-use token once;

        only its sha256 hash is stored. Binding an x402-per-request

        `invocation_id` then requires that token to have been atomically claimed

        immediately before facilitator verification/settlement by the exact

        authenticated buyer. Retained configured route reference: the token claim architecture uses `POST /api/x402/invoke/{id}` or `POST /api/x402/execute`. Receipt-verified Arbiter evidence must join the

        token to the exact plan, quote, preparation, capability, invocation,

        positive cost equal to the quote, and paid route/action/rail/source

        tuple. Free and zero-priced x402 calls are excluded.

        Other native invocations retain the existing buyer/capability binding

        and cost-at-or-below-quote checks. Seller earning-ledger rows are

        advisory evidence only and never promote a non-final invocation: an

        internal successful pending invocation stays non-final and is gated

        with 409 agent_commerce_settlement_pending until a final settlement

        status exists. External x402 settlement requires Base on-chain

        verification before SETTLED/RECEIPTED. When

        `AGENT_COMMERCE_MANDATE_EVALUATOR_ENABLED=true`, POLICY_APPROVED also

        records a public-safe `policy.mandate_evaluator` summary or returns

        `agent_commerce_mandate_evaluator_denied`, and RECEIPTED checks

        invocation/validation/settlement binding before minting or returns

        `agent_commerce_mandate_evaluator_receipt_denied`. Gate failures return

        409 without advancing; terminal failures (DENIED, EXPIRED,

        INVOCATION_FAILED, VALIDATION_FAILED, PAYMENT_FAILED,

        SETTLEMENT_FAILED, REFUNDED) are recorded with audit events. This

        route never spends funds and never calls providers.'
      security:
      - ApiKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                invocation_id:
                  type: string
                  description: Required when advancing into INVOKED
                target_state:
                  type: string
                  description: Optional safety check; must equal the next state
      responses:
        '200':
          description: Advanced plan plus transition record
          including exact payment-preparation evidence and a one-time raw x402 execution token at PAYMENT_PREPARED: null
          or bound paid x402 invocation evidence when applicable: null
        '400':
          description: Missing invocation_id at INVOKED
        '404':
          description: Plan or bound evidence not found
        '409':
          description: 'Gate blocked, state skip attempted, or plan in terminal state.

            x402-specific codes include `agent_commerce_x402_listing_unavailable`

            (with reason `listing_not_endpoint_backed`, `nft_supply_exhausted`,

            `reserved_auth_bound_endpoint`, `staged_stable_edge_service_not_live`,

            or `x402_runtime_signal_required`),

            `agent_commerce_x402_quote_price_drift`,

            `agent_commerce_x402_quote_listing_drift`,

            `agent_commerce_x402_paid_price_required`,

            `agent_commerce_x402_invocation_evidence_required`, and

            `agent_commerce_x402_invocation_amount_mismatch`. Paid route token

            failures use typed `agent_commerce_x402_token_*` codes for invalid,

            expired, replayed, drifted, inactive/wrong-buyer, stale mandate,

            wrong-route, claim-conflict, attempt-state persistence, or exact

            invocation/Arbiter/receipt-binding evidence. The durable token attempt

            stores only a sha256 payment-header hash and safe settlement references.

            '
