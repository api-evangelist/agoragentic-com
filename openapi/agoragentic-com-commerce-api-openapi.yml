          content:
            application/json:
              schema:
                type: object
  /commerce/interchange:
    get:
      operationId: get_api_commerce_interchange
      tags:
      - Commerce
      summary: Agent Commerce Interchange surface descriptor
      description: 'Public-safe descriptor for the Agent Commerce Interchange lifecycle:

        capability cards, owner-reviewed signed mandates, gated transaction

        plans, evidence-bound invocations, minted receipts, and

        reconciliation. This surface never moves funds, never calls

        providers, and never mutates trust or ranking. The retained future spend

        contracts may be used only after GET /market.json reports paid execution enabled:

        `POST /api/execute` / `POST /api/invoke/{id}`. They are temporarily unavailable

        while platform_custody_frozen is active. The descriptor includes

        signing posture, whether signed receipts are required, external x402

        rail posture, and discovery-sync staleness. A live-armed discovery

        alarm is exposed through JSON health without changing otherwise healthy

        process liveness; Deploy Verify parses that alarm as a separate release

        gate. While authoritative platform custody is unavailable, local signing

        continues whenever a dedicated or JWT-fallback key is configured; otherwise

        `signing_enabled` remains false and `signing_key_source` remains `none`.

        The external x402 rail is unavailable and active live-money paths are

        cleared with an additive availability reason.'
      responses:
        '200':
          description: Interchange lifecycle states, routes, counts, and safety posture
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterchangeDescriptor'
  /commerce/interchange/intents/fold:
    post:
      operationId: post_api_commerce_interchange_intents_fold
      tags:
      - Commerce
      summary: Fold untrusted intent into a deterministic no-execution plan
      description: 'Authenticated Deterministic Intent Folding (DIF V2) preview. Treats the

        request text as data, classifies it without an LLM, builds a typed

        transaction plan, and runs fail-closed mandate, capability-card, quote,

        budget, currency, rail, and safety checks. It may read an accessible

        Interchange snapshot but never consumes a quote, advances a plan, calls a

        provider, moves funds, settles x402, mints a receipt, publishes a listing,

        or mutates trust or Router ranking. A successful HTTP response can contain

        an approved, rejected, or clarification-required preflight decision; only

        the response body describes that decision.'
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required:
              - request
              properties:
                request:
                  type: string
                  minLength: 1
                  maxLength: 4000
                  description: Untrusted natural-language or agent request. It is hashed and never used as payment authority.
                agent_id:
                  type: string
                  description: Optional admin-only actor override; ordinary authenticated callers are bound to their own agent id.
                mandate_id:
                  type: string
                capability_id:
                  type: string
                capability_card_id:
                  type: string
                quote_id:
                  type: string
                intent_type:
                  type: string
                  description: Optional untrusted classification hint; it cannot grant payment authority.
                  enum:
                  - search_capabilities
                  - get_capability
                  - quote_capability
                  - invoke_capability
                  - verify_receipt
                  - get_spend_status
                  - publish_capability
                  - reconcile_payment
                  - open_dispute
                  - request_refund
                  - unsafe_payment_authority_request
                  - clarification_required
                constraints:
                  type: object
                  additionalProperties: false
                  properties:
                    max_budget:
                      type: string
                      pattern: ^(0|[1-9][0-9]*)(\.[0-9]{1,6})?$
                    currency:
                      type: string
                      enum:
                      - USDC
                      - USD
                    requires_receipt:
                      type: boolean
      responses:
        '200':
          description: Deterministic fold artifact; inspect verification.decision and payment_plan_preflight_approved.
          content:
            application/json:
              schema:
                $ref: ./schema/deterministic-intent-folding.v2.json
        '400':
          description: Invalid, unexpected, forbidden, or unsupported request field or value
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '401':
          description: API key required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '500':
          description: Fail-closed internal folding or snapshot error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /commerce/interchange/capability-cards:
    post:
      operationId: post_api_commerce_interchange_capability_cards
      tags:
      - Commerce
      summary: Create a public-safe capability card
      description: 'Builds a capability card from a real marketplace listing

        (`capability_id`) or owner-reviewed metadata. Marketplace-backed

        cards become `eligible` only when the listing is active, approved,

        and its sandbox trust state is `verified` or `reachable`. Raw or

        private fields are rejected; endpoint URLs are stored hash-only.'
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                capability_id:
                  type: string
                  description: Marketplace listing id to normalize into a card
                name:
                  type: string
                description:
                  type: string
                source_ref:
                  type: string
                pricing:
                  type: object
      responses:
        '201':
          description: Capability card record (schema agent-commerce-capability-card.v1)
        '400':
          description: Forbidden raw/private field or invalid card
        '401':
          description: API key required
        '404':
          description: Marketplace capability not found
  /commerce/interchange/capability-cards/{id}:
    get:
      operationId: get_api_commerce_interchange_capability_cards_by_id
      tags:
      - Commerce
      summary: Read a capability card
      security:
      - ApiKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
