  /commerce/interchange/mandates:
    post:
      operationId: post_api_commerce_interchange_mandates
      tags:
      - Commerce
      summary: Create a buyer mandate draft
      description: 'Creates an owner-scoped mandate draft with string-only budget caps

        (`max_per_call`, `max_daily`, `max_total`), allowed/forbidden

        actions, and allowed capability card refs. Mandates require owner

        review before any plan can pass the MANDATE_APPROVED gate.

        `idempotency_key` is required; replays return the existing mandate.

        When `INTERCHANGE_SANDBOX_MANDATES_ENABLED=true` and an owner-preset

        `INTERCHANGE_SANDBOX_MANDATE_ENVELOPE_JSON` is configured, the

        configured sandbox buyer may submit `sandbox_mandate:true` (or

        `mandate_tier:"sandbox"`) for the envelope''s single capability card.

        The auto-approved record is labeled non-production sandbox authority

        and remains capped by the envelope TTL, budget, action, rail, actor,

        and card scope. This surface still moves no funds and calls no

        providers; over-cap sandbox requests fail closed.'
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - buyer_agent_id
              - deployment_id
              - idempotency_key
              properties:
                buyer_agent_id:
                  type: string
                deployment_id:
                  type: string
                sandbox_mandate:
                  type: boolean
                mandate_tier:
                  type: string
                  enum:
                  - sandbox
                capability_card_id:
                  type: string
                allowed_capability_card_refs:
                  type: array
                  items:
                    type: string
                allowed_actions:
                  type: array
                  items:
                    type: string
                allowed_rails:
                  type: array
                  items:
                    type: string
                    enum:
                    - internal
                    - external_x402
                payment_method:
                  type: string
                  enum:
                  - internal_balance
                  - x402_per_request
                  default: internal_balance
                  description: Default native-marketplace payment preparation method for plans under this mandate. x402_per_request defers the internal balance check but grants no payment authority.
                expires_at:
                  type: string
                  format: date-time
                budget:
                  type: object
                  properties:
                    max_per_call:
                      type: string
                    max_daily:
                      type: string
                    max_total:
                      type: string
                idempotency_key:
                  type: string
      responses:
        '201':
          description: Mandate record (schema agent-commerce-mandate.v1, approval_status draft or approved sandbox envelope)
        '400':
          description: Numeric money value, forbidden field, or missing idempotency key
        '401':
          description: API key required
        '409':
          description: Sandbox envelope disabled, missing, expired, or exceeded
  /commerce/interchange/mandates/{id}:
    get:
      operationId: get_api_commerce_interchange_mandates_by_id
      tags:
      - Commerce
      summary: Read a mandate (owner/buyer scoped)
      security:
      - ApiKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Mandate record with review state and evidence
        '404':
          description: Mandate not found or not visible to this agent
  /commerce/interchange/mandates/{id}/review:
    post:
      operationId: post_api_commerce_interchange_mandates_by_id_review
      tags:
      - Commerce
      summary: Owner approve/reject a mandate (signed evidence)
      description: 'Only the mandate owner (or admin) may review. Approval/rejection

        produces a mandate-evidence record (schema

        agent-commerce-mandate-evidence.v1) with a sha256 evidence hash and

        an HMAC-SHA256 signature when a signing secret is configured;

        signature presence is reported honestly.'
      security:
      - ApiKeyAuth: []
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - decision
              properties:
                decision:
                  type: string
                  enum:
                  - approve
                  - reject
                reason:
                  type: string
      responses:
        '200':
          description: Reviewed mandate with signed evidence
        '403':
          description: Reviewer is not the mandate owner or admin
        '404':
          description: Mandate not found
        '409':
          description: Mandate already reviewed
  /commerce/interchange/plans:
    post:
      operationId: post_api_commerce_interchange_plans
      tags:
      - Commerce
      summary: Create a transaction plan (state DISCOVERED)
      description: 'Creates a durable transaction plan bound to a capability card and

        mandate. Plans advance one state at a time through

        DISCOVERED → NORMALIZED → ELIGIBLE → QUOTED → MANDATE_APPROVED →

        POLICY_APPROVED → PAYMENT_PREPARED → INVOKED → VALIDATED → SETTLED →

        RECEIPTED → RECONCILED via the advance route. `idempotency_key` is

        required; replays return the existing plan.'
      security:
      - ApiKeyAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - capability_card_id
              - mandate_id
              - idempotency_key
              properties:
                capability_card_id:
                  type: string
                mandate_id:
                  type: string
                requested_action:
                  type: string
                  default: EXECUTE
                max_amount:
                  type: string
                  description: String-only money cap for this plan
                payment_method:
                  type: string
                  enum:
                  - internal_balance
                  - x402_per_request
                  description: Optional plan override. Defaults to the mandate payment_method. x402_per_request is limited to native marketplace cards on the internal rail.
                idempotency_key:
                  type: string
      responses:
        '201':
          description: Transaction plan record in state DISCOVERED
        '400':
          description: Invalid plan input
        '404':
          description: Capability card or mandate not found
        '409':
          description: Card/rail incompatibility or sandbox envelope policy blocked plan creation
  /commerce/interchange/plans/{id}:
    get:
      operationId: get_api_commerce_interchange_plans_by_id
