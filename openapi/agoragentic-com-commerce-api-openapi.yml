  /commerce/purchase-sessions/{id}/approve:
    post:
      operationId: post_api_commerce_purchase_sessions_by_id_approve
      tags:
      - Commerce
      summary: Approve a quoted Router Checkout session
      description: Records explicit approval for a quoted checkout session. This does not execute. If the session is supervisor-gated, the matching purchase_approvals row must already be approved.
      security:
