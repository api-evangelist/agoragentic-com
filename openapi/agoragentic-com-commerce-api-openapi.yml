        executing spend. `max_total_usdc`, `max_step_usdc`, and approval thresholds

        are enforced here before execution can be requested. Quote generation also

        records Consequences Engine evidence and creates/reuses supervisor approval

        requests when buyer policy requires supervised spend.'
