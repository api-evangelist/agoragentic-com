                - $ref: '#/components/schemas/HandoffRejectedRequest'
                - $ref: '#/components/schemas/HandoffInternalError'
        '413':
          description: Payload limit exceeded before the handler.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandoffPayloadTooLarge'
        '414':
          description: Request target exceeds the existing URL length limit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandoffUriTooLong'
        '429':
          description: Request admission throttled; honor Retry-After.
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/HandoffRateLimited'
                - $ref: '#/components/schemas/HandoffProbeRateLimited'
          headers:
            Retry-After:
              description: Seconds until the current IP admission budget permits retry. This is not permission for an external action.
              schema:
                type: integer
                minimum: 0
        '500':
          description: Internal failure; no private error detail is returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HandoffInternalError'
        '503':
