      description: 'ARD resource entry. Exactly one of url or data is required; identifiers are

        anchored to the publisher domain. Ingested candidates remain source-attributed

        and unverified. The normalizer rejects conflicting current authority claims and

        forces all ten discovery authority fields false. It also keeps the legacy

        `ag:executionAuthorityGranted`, `ag:paymentAuthorityGranted`,

        `ag:trustPromotionAuthorized`, `ag:publicationAuthorityGranted`, and

        `ag:networkDereferenceAllowed` fields false, along with

