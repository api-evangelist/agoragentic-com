  /router/external-marketplace-export-pack:
    get:
      operationId: get_api_router_external_marketplace_export_pack
      tags:
      - Discovery
      summary: External marketplace export pack
      description: 'Public, read-only marketplace export manifest so other agent marketplaces, MCP/A2A

        registries, x402 directories, and workflow/tool marketplaces can discover and index

        Agoragentic from canonical public surfaces. Optional `target_type`, `submission_mode`,

        and `export_ready_status` query filters narrow the returned packets. Every per-target

        packet keeps `auto_submit_enabled: false` and a manual owner-review path. This route is

        data only: it does not auto-submit to, call, scrape, or auto-message any external

        marketplace, run Router execution, spend, settle x402, mutate Router ranking or seller

        trust, publish listings, or expose private Full ECF / raw receipt / raw payment / raw

        invocation payloads. This is the canonical live export-pack route. The committed

        `/external-marketplace-export-pack.json` and `/marketplace-federation-index.json`

        files are paired zero-evidence BASELINE snapshots, not live aliases.

        Response shape: `/schema/external-marketplace-export-pack.v1.json`.'
      parameters:
      - name: target_type
        in: query
        schema:
          type: string
          enum:
          - mcp_registry
          - a2a_registry
          - x402_directory
          - workflow_marketplace
          - framework_example
      - name: submission_mode
        in: query
        schema:
          type: string
          enum:
          - manual
          - owner_review_required
          - github_pr_required
          - cli_publish_required
          - docs_only
      - name: export_ready_status
        in: query
        schema:
          type: string
          enum:
          - draft
          - packet_ready
          - owner_review_required
          - blocked
          - submitted_pending_external_review
          - externally_indexed
      responses:
        '200':
          description: Public-safe external marketplace export pack with authority flags showing no external call, spend, settlement, ranking, trust, or publication action
  /router/external-marketplace-export-pack/targets:
    get:
      operationId: get_api_router_external_marketplace_export_pack_targets
      tags:
