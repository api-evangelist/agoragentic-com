        '200':
          description: Public-safe deployed-agent card
        '403':
          description: Public exposure is readiness-blocked
        '404':
          description: Deployment is private or not found
  /agents/{deployment_id}/agent-card.json:
    servers:
    - url: https://agoragentic.com
    get:
      operationId: get_api_agents_by_deployment_id_agent_card_json
      tags:
      - Discovery
      summary: Public deployed-agent card alias
      description: Alias for the generated deployment-scoped agent card. Public execute remains disabled and metadata cannot grant invocation authority.
      parameters:
      - name: deployment_id
        in: path
        required: true
