    ArdContext:
      description: 'Canonical active JSON-LD context value. Inline objects and the two embedded

        pinned URLs are accepted without a network request. During static manifest

        ingestion, any other remote context and every JSON-LD `@import` (including an

        import that names a pinned URL) are unsupported. The normalizer emits an

        `UNSUPPORTED_CONTEXT_PRESERVED` warning, never fetches or dereferences the

        context, replaces the active `@context` with the exact embedded pinned array

        `["https://agenticresourcediscovery.org/context/v1",

        "https://agoragentic.com/ns/ard/v1"]`, drops non-core/non-canonical extension

        keys from the sanitized candidate entry, and retains only structured

        `contexts.unsupported` evidence plus a hash-only

        `contexts.preserved_unresolved` record with `raw_included: false`. The

        Agoragentic extension URL

        `https://agoragentic.com/ns/ard/v1` serves the same exact 1,801-byte snapshot

        whose SHA-256 is

        `101836857e9a7863ca4b2f38b6c79779b26a1ba79cb5694d1446cf59e17164f7`.

        '
      oneOf:
      - type: string
        format: uri
        enum:
        - https://agenticresourcediscovery.org/context/v1
        - https://agoragentic.com/ns/ard/v1
      - type: object
        additionalProperties: true
      - type: array
        items:
          $ref: '#/components/schemas/ArdContext'
