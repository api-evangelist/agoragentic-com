        capability card. The mapper requires every Interchange authority flag to be

        false, emits hashes instead of a raw source reference, never includes the raw

        payload, reuses bounded ARD normalization, and does not automatically publish

        the entry into the canonical manifest, search index, Router, or marketplace.

