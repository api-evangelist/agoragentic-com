      description: Public-safe receipt summary for listing-backed deployments. Raw private receipt payloads, private ECF, raw tool outputs, and buyer-private details are excluded.
      parameters:
      - name: deployment_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Public-safe receipt summary or honest unavailable status
        '403':
