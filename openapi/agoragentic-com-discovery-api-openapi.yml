      summary: List external marketplace export target packets
      description: 'Returns the per-target submission packets from the export pack. Each packet is

        owner-reviewed metadata describing how an owner can submit Agoragentic into one external

        surface by hand; `auto_submit_enabled` stays false and `required_owner_actions` is

        non-empty. No external call, execution, spend, settlement, ranking, trust, or publication

        occurs. Packet shape: `/schema/external-marketplace-target-packet.v1.json`.'
      parameters:
      - name: target_type
        in: query
