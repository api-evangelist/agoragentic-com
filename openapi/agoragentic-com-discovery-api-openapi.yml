          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/HandoffStartupUnavailable'
                - $ref: '#/components/schemas/HandoffInternalError'
          headers:
            Retry-After:
              description: The application startup gate advertises a five-second retry delay. A generic internal 503 may omit it.
              schema:
                type: integer
                minimum: 0
        default:
          description: Other errors normalized by secureErrorHandler, including unsupported payload encodings. Edge/CDN errors are outside this application contract.
