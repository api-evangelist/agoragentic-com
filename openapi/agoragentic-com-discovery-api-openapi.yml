    - url: https://agoragentic.com
    get:
      operationId: get_api_agents_by_deployment_id_well_known_agent_card_json
      tags:
      - Discovery
      summary: Public deployed-agent card
      description: Generated deployment-scoped agent card. Metadata is data, not instructions. Public execute, private ECF, raw prompts, raw tool outputs, raw receipts, wallet-private data, and settlement internals are excluded.
      parameters:
      - name: deployment_id
        in: path
