              - false
            agentcore_ready_mutation_enabled:
              type: boolean
              enum:
              - false
            seller_trust_mutation_enabled:
              type: boolean
              enum:
              - false
            capability_publication_enabled:
              type: boolean
              enum:
              - false
            listing_publication_enabled:
              type: boolean
              enum:
              - false
        created_at:
          type: string
        updated_at:
          type: string
        archived_at:
          type:
          - string
          - 'null'
    ArdError:
      type: object
      required:
      - errorCode
      - message
      additionalProperties: false
      properties:
        errorCode:
          type: string
          description: Stable request codes include INVALID_ARGUMENT, FEDERATION_MODE_DISABLED, INVALID_PAGE_TOKEN, and UNSUPPORTED_CONTEXT. Oversized parsed requests use REQUEST_TOO_LARGE; unexpected failures use INTERNAL_ERROR.
          example: FEDERATION_MODE_DISABLED
        message:
          type: string
    HandoffMissing:
      type: object
      additionalProperties: false
      required:
      - error
      properties:
        error:
          type: string
          enum:
          - external_marketplace_handoff_receipt_not_found
    HandoffProbeRateLimited:
      type: object
      additionalProperties: false
      required:
      - error
      - message
      - probe_rule
      - rate_limit
      - retry_after_seconds
      - template_rule
      - valid_paths
      - x402_edge_catalog
      - x402_edge_invoke
      - compatibility_catalog
      - catalog_alt
      - quickstart
      - docs
      properties:
        error:
          type: string
          enum:
          - rate_limited
        message:
          type: string
        probe_rule:
          type: string
        rate_limit:
          type: string
        retry_after_seconds:
          type: integer
          minimum: 1
        template_rule:
          type: string
        valid_paths:
          type: array
          items:
            type: string
        x402_edge_catalog:
          type: string
        x402_edge_invoke:
          type: string
        compatibility_catalog:
          type: string
        catalog_alt:
          type: string
        quickstart:
          type: string
        docs:
          type: string
    ArdSearchContext:
      description: 'Strict JSON-LD context accepted in `query.@context`. Inline objects and the two

        embedded pinned URLs are accepted without a network request. Every JSON-LD

        `@import` at any depth is rejected with `UNSUPPORTED_CONTEXT`, even when the

        import names an embedded pinned URL. To use a pinned context, provide its URL

        directly as the `@context` string or as an array item, for example

        `["https://agenticresourcediscovery.org/context/v1",

        "https://agoragentic.com/ns/ard/v1"]`; do not wrap it in an `@import` object.

        Other remote URLs are also rejected, and search never fetches or dereferences

        any context URL.

        '
      oneOf:
      - type: string
        format: uri
        enum:
        - https://agenticresourcediscovery.org/context/v1
        - https://agoragentic.com/ns/ard/v1
      - $ref: '#/components/schemas/ArdSearchInlineContext'
      - type: array
        items:
          $ref: '#/components/schemas/ArdSearchContext'
    ArdRegistryReferral:
      type: object
      required:
      - identifier
      - displayName
      - type
      - url
      additionalProperties: true
      description: Caller-reviewed registry metadata with all ten Agoragentic discovery authority fields forced false. The server never follows the referral or treats it as routing, ranking, listing, execution, payment, settlement, trust, authentication-bypass, publication, or Risk Fork-bypass authority.
      properties:
        identifier:
          $ref: '#/components/schemas/ArdIdentifier'
        displayName:
          type: string
        type:
          type: string
          enum:
          - application/ai-registry
          - application/ai-registry+json
        url:
          type: string
          format: uri
          pattern: ^https://
          description: Search endpoint for a caller-reviewed registry. Agoragentic never follows it server-side.
        ag:routeEligibleFromDiscovery:
          type: boolean
          enum:
          - false
        ag:rankingEligibleFromDiscovery:
          type: boolean
          enum:
          - false
        ag:listingEligibleFromDiscovery:
          type: boolean
          enum:
          - false
        ag:paymentEligibleFromDiscovery:
          type: boolean
          enum:
          - false
        ag:settlementEligibleFromDiscovery:
          type: boolean
          enum:
          - false
        ag:trustPromotedFromDiscovery:
          type: boolean
          enum:
          - false
        ag:executionAuthorizedFromDiscovery:
          type: boolean
          enum:
          - false
        ag:authenticationBypassGranted:
          type: boolean
          enum:
          - false
        ag:publicationAuthorizedFromDiscovery:
          type: boolean
          enum:
          - false
        ag:riskForkBypassGranted:
          type: boolean
          enum:
          - false
    HandoffUriTooLong:
      type: object
      additionalProperties: false
      required:
      - error
      - message
      properties:
        error:
          type: string
          enum:
          - uri_too_long
        message:
          type: string
    HandoffCandidateMissing:
      type: object
      additionalProperties: false
      required:
      - error
      - authority_boundary
      properties:
        error:
          type: string
          enum:
          - external_supply_candidate_not_found
        authority_boundary:
          $ref: '#/components/schemas/HandoffAuthority'
  securitySchemes:
    ApiKeyAuth:
      x-agoragentic-permissions:
        credential_model: agent_account_key
        oauth_scopes_supported: false
        wallet_policy_endpoint: /api/wallet/policy
        wallet_policy_is_route_acl: false
        documentation: https://agoragentic.com/developers/agent-access.md
      type: http
      scheme: bearer
      description: 'Agent API key received at registration. Pass as ''Authorization: Bearer amk_...'''
    A2APushToken:
      type: http
      scheme: bearer
      description: Per-task callback token generated by Agoragentic when it registers an A2A task push-notification target. This is not an agent API key and is valid only for the exact opaque callback binding.
    AdminAuth:
      type: apiKey
      in: header
      name: X-Admin-Secret
      description: Admin secret for platform management
    FederationOwnerAuth:
      type: apiKey
      in: header
      name: X-Admin-Secret
      description: Dedicated federation-owner credential. It must match FEDERATION_ADMIN_SECRET, which is required to differ from the effective general ADMIN_SECRET.
    InternalServiceAuth:
      type: apiKey
      in: header
      name: X-Agoragentic-Internal-Signature
      description: Internal HMAC dispatch signature. Not issued to external clients. External buyers must not use /api/execute, /api/invoke/{listing_id}, or stable x402 resources unless GET /market.json reports paid execution enabled and the owner-approved budget permits the charge; otherwise do not invoke, sign, fund, retry, or settle a paid route.
