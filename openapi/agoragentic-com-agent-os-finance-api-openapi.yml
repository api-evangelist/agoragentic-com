      description: Creates a queued control-plane financial-research job record and provider classification metadata without calling Fincept or any provider. The queued job/output contract is documented by /schema/financial-research-job.v1.json. Fincept remains external/user-managed with license review required. Research jobs cannot directly execute orders or purchases. Topic, symbol, scope, and candidate-action metadata must be bounded public-safe strings and reject raw URLs, token-looking values, credentials, account/card/payment/wallet values, and raw provider payloads before storage. Topic/scope/candidate summary text is capped at 512 characters, candidate action types at 96 characters, symbols at 25 labels of 32 characters each, and generic scope arrays at 50 items. Optional artifact IDs/types/refs/hashes must be bounded redacted values, not raw URLs, tokenized URLs, credentials, account/card/payment/wallet values, or raw provider payloads. Supplied citation URLs must be public-safe HTTP(S) source URLs without credentials or tokenized/private query parameters. Optional C0 options signal intelligence is shaped by /schema/finance-agent-options-signal-intelligence.v1.json and remains friend-facing research-only metadata with normalized signal fields, citations, risk summary, non-advice disclaimer, and redacted receipts only; it cannot include option order payloads, contract IDs, OCC symbols, order legs, provider/MCP dispatch fields, route/live-read-route authority fields, wallet/x402/publication flags, personalized advice, or executable flags. C1 options review packets are also research-only metadata; options_review_packet is accepted only with options_signal_intelligence, shaped by /schema/finance-agent-options-review-packet.v1.json, and cannot include option order schemas, contract IDs, OCC symbols, order legs, provider/MCP dispatch fields, route live-read authority fields, wallet/x402/publication flags, personalized advice, or executable flags, and must keep forced-false route authority flags including route_can_create_live_read_route:false, route_can_execute:false, route_can_dispatch_provider:false, and route_can_approve_options_execution:false.
      security:
      - ApiKeyAuth: []
      parameters:
      - name: deployment_id
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - write
              - idempotency_key
              - topic
              properties:
                write:
                  type: boolean
                  const: true
                idempotency_key:
                  type: string
                provider_id:
                  type: string
                  default: fincept_terminal
                topic:
                  type: string
                  maxLength: 512
                  description: Public-safe research topic only. Raw URLs, token-looking values, credentials, account/card/payment/wallet values, and raw provider payloads are rejected before storage.
                instrument_scope:
                  type: string
                  enum:
                  - equity
                  - options_signal_intelligence
                  description: Optional research scope. options_signal_intelligence is non-executable metadata only.
                scope:
                  type: object
                  additionalProperties: true
                  description: Optional bounded public-safe research scope metadata. Raw URLs, token-looking values, credentials, account/card/payment/wallet values, and raw provider payloads are rejected before storage.
                  properties:
                    topic:
                      type: string
                      maxLength: 512
                    symbols:
                      type: array
                      maxItems: 25
                      items:
                        type: string
                        maxLength: 32
                    time_horizon:
                      type: string
                      maxLength: 512
                    risk_constraints:
                      type: array
                      maxItems: 50
                      items:
                        type: string
                        maxLength: 512
                    research_question:
                      type: string
                      maxLength: 512
                symbols:
                  type: array
                  maxItems: 25
                  items:
                    type: string
                    maxLength: 32
                  description: Optional bounded public-safe symbol labels. Values are normalized to uppercase and raw URLs, token-looking values, credentials, account/card/payment/wallet values, and raw provider payloads are rejected before storage.
                citation_policy:
                  type: object
                  additionalProperties: true
                  description: Citation and non-advice disclaimer requirements for future research output.
                cost_budget_usdc:
                  type: number
                  minimum: 0
                artifact_refs:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                  description: Optional redacted artifact IDs/types/refs/hashes only. Raw URLs, tokenized URLs, credentials, account/card/payment/wallet values, and raw provider payloads are rejected before storage; public citation URLs belong inside output.citations.
                output:
                  type: object
                  additionalProperties: true
                  description: Optional already-produced research output for validation only; citations and non-advice disclaimer are required when supplied, and citation URLs must be public-safe HTTP(S) source URLs without credentials or tokenized/private query parameters. options_review_packet is accepted only with options_signal_intelligence, is shaped by /schema/finance-agent-options-review-packet.v1.json, and must carry owner/compliance/brokerage-options/MCP gates, reject option order schemas, contract IDs, OCC symbols, order legs, provider/MCP dispatch, route live-read authority, wallet/x402/publication flags, and personalized advice, and keep forced-false execution and route-authority flags including route_can_create_live_read_route:false.
                candidate_actions:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                    properties:
                      action_type:
                        type: string
                        maxLength: 96
                      symbol:
                        type: string
                        maxLength: 32
                      summary:
                        type: string
                        maxLength: 512
                  description: Optional bounded public-safe candidate-action metadata. Any candidate action must have executable_directly:false, must not describe options order execution, and must not include raw URLs, token-looking values, credentials, account/card/payment/wallet values, or raw provider payloads.
      responses:
        '201':
          description: Research job control-plane record with job_id
          provider metadata: null
          external_user_managed execution mode: null
          license_review_required: null
          queued_control_plane or draft status: null
          output contract: null
          receipt/evidence refs: null
          non-executable candidate actions: null
          optional gated no-action options review packet metadata: null
          no vendored provider code: null
          no partnership claim: null
          and no provider call performed: null
        '400':
          description: Missing idempotency key
          write flag: null
          topic: null
          unknown provider: null
          budget over cap: null
          invalid output: null
          executable candidate action: null
          ungated options review packet: null
          options order schema: null
          overlong/oversized public-safe metadata: null
          raw URL/token-looking topic: null
          symbol: null
          scope metadata: null
          candidate action metadata: null
          artifact types/refs/hashes: null
          tokenized/private/credentialed citation URL: null
          or forbidden private/live-action field: null
        '401':
          description: Missing owner/admin authentication
        '404':
          description: Deployment not found for authenticated owner/admin
