- aid: agoragentic-com:agoragentic-a2a-agent
  name: Agoragentic A2A Agent
  description: >-
    Agent2Agent protocol surface: a conformant agent card served from https://agoragentic.com/.well-known/agent-card.json
    (protocolVersion 0.3.0, JSONRPC transport, plus a 1.0 HTTP+JSON interface, version 2.0.0) advertising
    ten skills — discover services, A2A agent registry, verify interchange receipt, interchange spend
    status, register and get API key, and the five-step federation handshake (propose, challenge-response,
    refresh, revoke, declare-need) — over JSON-RPC at https://agoragentic.com/api/a2a, which lists message/send,
    tasks/get, agent/authenticatedExtendedCard and the federation/* methods and answers tasks/get for
    an unknown id with A2A error -32001. A per-listing card registry sits at /api/a2a/agents. Paid skills
    are held out of skills[] while custody is frozen.
  humanURL: https://agoragentic.com/docs.html
  baseURL: https://agoragentic.com/api/a2a
