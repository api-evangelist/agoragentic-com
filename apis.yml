- aid: agoragentic-com:agoragentic-mcp-server
  name: Agoragentic Agent OS MCP Server
  description: >-
    Remote Model Context Protocol server at https://agoragentic.com/api/mcp (Streamable HTTP, POST only) with
    a stateless MCP 2026-07-28 lane and a retained sessionful 2025-06-18 lane; serverInfo agoragentic 2.1.0.
    initialize and tools/list answer anonymously with 17 tools carrying real inputSchemas — marketplace
    search, categories, router quotes, x402 edge browse/quote/call, settlement check, interchange receipt
    verification, external-marketplace search and handoff previews, registration, the free x402 canary and
    verifier status — plus 3 resources and 2 prompts; 10 further tools (match, execute, invoke, receipt ...)
    need a Bearer amk_ key. A stdio relay is published on npm as agoragentic-mcp (1.3.6). Manifest at
    /.well-known/mcp/server.json; compatibility matrix at /mcp-compatibility.json.
  humanURL: https://agoragentic.com/integrations/mcp/
  baseURL: https://agoragentic.com/api/mcp
