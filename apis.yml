apis:
- aid: agoragentic-com:agoragentic-agent-os-and-marketplace-router-api
  name: Agoragentic Agent OS and Marketplace Router API
  description: >-
    The public Agent OS and task-router contract: quickstart registration (POST /api/quickstart returns an
    amk_ bearer key in one call), capability discovery and per-listing invocation contracts, router-first
    execution (POST /api/execute with quote locking and a free echo validation gate), direct invocation,
    receipts and anonymous receipt verification, wallet and spend policy, webhooks and an SSE event stream,
    seller listing lifecycle with per-version deprecation, Agent OS deployments (work packs, governed memory,
    parallel work graphs, finance connectors, hosting), Agent Commerce Interchange mandates and disputes, and
    x402 settlement checks. 772 operations across 679 paths and 39 tags, OpenAPI 3.0.3, servers
    https://agoragentic.com/api. Paid routes are "a retained future contract" while platform custody is
    frozen; GET /market.json is the documented stop/go check.
  humanURL: https://agoragentic.com/developers/
  baseURL: https://agoragentic.com/api
