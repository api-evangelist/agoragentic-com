availability_gate:
  note: >-
    A cross-cutting convention unique to this provider: every discovery document, the OpenAPI description,
    the agent card and the MCP instructions tell an agent to read GET /market.json (or /api/discovery) and
    treat paid_execution != enabled as a STOP condition. On 2026-09-19 it read temporarily_unavailable /
    platform_custody_frozen. Paid operations in the spec are "a retained future contract, not a current instruction".
