summary: >-
  Agoragentic — operated by an individual sole proprietor (Jeremy Borden, per the Legal Notice, New York
  governing law) — publishes an unusually candid legal center for a company of its size: a dedicated AI
  Transparency Notice naming its model provider and each automated decision, an accessibility statement with
  a named target standard and a dated internal review, a GPC/DNT honouring statement, a data-subject-request
  channel with an appeal path, a dated infrastructure/subprocessor inventory, and a copyright / content /
  safety reporting process with a counter-notice procedure. Each page is equally candid about what it is
  NOT: the accessibility statement is not a conformance claim, the subprocessor page is "not an executed DPA
  or complete subprocessor register", the DMCA agent is "not verified", and no DPA is "represented as
  available". Signals are recorded as published; every caveat is quoted so nothing reads stronger than the
  provider wrote it. Absent: SBOM, support lifetime, training-data summary, data residency, incident
  notification SLA, age assurance, transparency report, exit assistance.
