        "AWS Bedrock-hosted Anthropic Claude is evidenced for listing moderation, community-flag review, and
        advisory marketplace dispute review. A dispute model recommendation cannot refund a buyer, pay a
        seller, restore a payout, or otherwise authorize financial movement."
    - source: https://agoragentic.com/ai-transparency.html
      quote: '"Point-of-interaction notices still required where applicable" — the notice itself flags where Art. 50-style disclosure is not yet in place.'
    note: >-
      A dedicated notice with a use/method/effect table (listing review, community-flag review, marketplace
      disputes, routing and ranking, customer-configured agent work), the data sent to the model per use, the
      human-review band for listing scores, and a training statement ("does not use private customer
      submissions to train Agoragentic general-purpose models unless the customer consents, configures that
      use, or submits the information publicly"). The Terms also incorporate it by reference.
