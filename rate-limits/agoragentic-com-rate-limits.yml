summary: >-
  Agoragentic publishes its limits AND signals them at runtime. Observed live: an anonymous IP limit of 60
  requests per minute with a burst of 15 per 5 seconds, enforced with HTTP 429 and a JSON body that states
  both numbers and a retry_after_ms of 5000; every response on the limited surface carries BOTH the IETF
  draft-ietf-httpapi-ratelimit-headers-11 fields (RateLimit-Policy: "request";q=60 and RateLimit:
  "request";r=<remaining>;t=<seconds>) and the legacy X-RateLimit-Limit / X-RateLimit-Remaining /
  X-RateLimit-Reset triple. The provider's agent-access.md documents exactly this (q = quota, r =
  remaining, t = delay in SECONDS not a timestamp). DISCREPANCY RECORDED: the agent-marketplace.json
  manifest still says "ip: 120 requests/minute, burst: 30 requests/5 seconds, authenticated: 60
  requests/minute per agent" — half the observed anonymous ceiling; the runtime numbers are the ones an
  agent will actually hit. Per-agent, per-capability limits also exist (the 429 body says so and each
  listing publishes rate_limit and concurrency_limit fields) but their values are per-listing data, not a
  single published number.
rate_limits:
- name: Anonymous IP limit
  scope: per-ip
  limit: 60
  window: 1 minute
  burst: 15 requests per 5 seconds
  metric: request
  exhaustion_status: 429
  headers: [RateLimit, RateLimit-Policy, X-RateLimit-Limit, X-RateLimit-Remaining, X-RateLimit-Reset]
  retry_after: 'retry_after_ms: 5000 in the JSON body ("Wait 5 seconds before retrying."); agent-access.md says honor Retry-After (delay-seconds or HTTP-date) when present'
  observed:
    status: 429
    content_type: application/json; charset=utf-8
    body: '{"error":"rate_limited","message":"Too many requests from your IP address. Please slow down.","retry_after_ms":5000,"next_steps":{"wait":"Wait 5 seconds before retrying.","tip":"Implement exponential backoff in your request loop.","limits":"IP limit: 60 requests/minute (anonymous), burst: 15 requests/5s","note":"This is an IP-level limit. Anonymous traffic is capped at 60/min. Per-agent rate limits are separate and measured per-capability."}}'
    headers_on_200: 'RateLimit-Policy: "request";q=60 | RateLimit: "request";r=58;t=59 | X-RateLimit-Limit: 60 | X-RateLimit-Remaining: 58 | X-RateLimit-Reset: 1789859266 | X-Request-Id: <uuid>'
    note: Hit by this pass after ~25 rapid page fetches; cleared after pacing requests at 1.6 s.
