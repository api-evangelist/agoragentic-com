discovery:
  path: /.well-known/agent-card.json
  canonical: true
  host: agoragentic.com
  note: >-
    Served from the apex host, which is also the OpenAPI servers[] host (https://agoragentic.com/api), the
    MCP host (https://agoragentic.com/api/mcp) and the A2A JSON-RPC host (https://agoragentic.com/api/a2a).
    www.agoragentic.com 301s every /.well-known/* path to the apex. The legacy /.well-known/agent.json ALSO
    answers 200 (9,638 bytes) but is not an AgentCard: it declares itself "a2a_role: compatibility_alias"
    with a2a_canonical "/.well-known/agent-card.json", carries no capabilities or skills, and is a broader
    discovery manifest (endpoints, onboarding, payment availability). It is saved under well-known/ as
    agoragentic-com-agent.json and not graded here. A negative-control path
    (/.well-known/agoragentic-com-negative-control-7f3ab91c.json) returns the host's real JSON 404
    ({"error":"not_found"...}, 106 bytes), so the 200 on agent-card.json is a served document and not a
    catch-all. Ownership is not in question: provider.organization is "Agoragentic" with provider.url
    https://agoragentic.com, the card's url is https://agoragentic.com/api/a2a, and the OpenAPI at the same
    host titles itself "Agoragentic Agent OS and Marketplace Router API" with contact support@agoragentic.com.
