summary: >-
  Agoragentic's conformance profile is the agent-protocol stack rather than any enterprise or sector
  standard, and it is unusually well evidenced by the provider itself: an A2A 0.3.0 agent card at the
  canonical RFC 8615 path (graded conformant), a hosted MCP server that the provider's own compatibility
  matrix says is verified against MCP 2026-07-28 with two independent clients (and which this pass observed
  on the sessionful 2025-06-18 lane), JSON-RPC 2.0 on both, an x402 payment surface in USDC on Base
  (eip155:8453, Coinbase CDP facilitator) that is deployed but frozen, IETF draft-ietf-httpapi-ratelimit-
  headers-11 fields observed live, an RFC 9116 security.txt, an ai-plugin.json, an Agentic Resource
  Discovery (ARD 1.0) manifest, and llms.txt / agents.txt / skill.md. It declares NO OAuth 2.0 / OIDC (by
  design — agent-account bearer keys), no RFC 9457 problem details, no RFC 8594 Sunset/Deprecation headers,
  no RFC 9727 api-catalog, no RFC 9728 protected-resource metadata, and no SOC 2 / ISO 27001 / GDPR
  certification — the trust page states SOC 2 Type II is "Not claimed" and GDPR compliance is "Planned".
