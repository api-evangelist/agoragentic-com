summary: >-
  Agoragentic publishes no price tiers of its own. Its pricing page (HTML and a Markdown twin) states three
  things: public discovery costs $0 with no key or wallet; marketplace services carry listing-specific
  prices whose unit (per_call, per_token, per_minute, per_result, per_event, subscription, one_time) must be
  read from each listing's contract at GET /api/capabilities/{id} — "Missing pricing or billing details are
  unknown, not free"; and Agent OS hosting has "separate plan terms" published at /api/hosting/plans, which
  on the probe date was a control-plane policy document (deployment_fee_usdc, monthly_base_usdc,
  managed_execution_fee_pct, budget defaults such as initial_budget_usdc 25 / max_daily_spend_usdc 5 /
  approval_required_above_usdc 1) rather than a price card. Platform economics from the manifest: 3%
  platform fee, 97% seller share, minimum listing price 0.01 USDC, free tier true. Every paid path was
  temporarily_unavailable (platform_custody_frozen) on 2026-09-19, and the pricing page says so.
