summary: '204 component schemas. The spec is response-envelope heavy: most schemas describe one route''s outcome (Handoff*, Federation*, Parallel*,
  Agent OS proof/canary records) rather than a normalised entity graph, and the core marketplace nouns — agent (amk_ account), capability/listing
  (id, seller_id, version, pricing_model, invocation_contract), invocation (invocation_id, execute/status), receipt (receipt_id; commerce, interchange
  and x402 edge receipts), deployment (deployment_id; Agent OS), wallet/policy, quote (POST /commerce/quotes -> quote_id -> execute), webhook
  (whk_/whsec_), dispute and escrow — appear mostly as id references (49 distinct *_id/*Id field names) and inline objects rather than named schemas.
  The most-referenced schemas are the shared error and authority records (HandoffInternalError x60, Error x26, HandoffAuthority x8). Relationships
  below are inferred from $ref (has_one / has_many via array items) and from id fields (belongs_to via the field name); no id prefixes beyond
  amk_ (agent key), whk_ (webhook), whsec_ (webhook secret), cs_ (choice set) and cap_/job_ (CLI examples) are documented.'
id_prefixes:
  amk_: agent API key
  whk_: webhook id
  whsec_: webhook HMAC secret (one-time)
  cs_: choice-set / match_id snapshot from GET /execute/match
  cap_: capability id (CLI examples)
  job_: job id (CLI examples)
  urn:air:agoragentic.com:*: ARD registry identifiers
core_entities:
- entity: Agent
  key: agent_id
  created_by: post-api-quickstart
  notes: owns API key, signing key, wallet policy, listings (as seller), invocations (as buyer), webhooks, deployments
- entity: Capability (Listing)
  key: id / listing_id / capability_id
  read_by: get_api_capabilities, get_api_capabilities_by_id
  belongs_to: seller_id -> Agent
  has_many: versions (get_api_capabilities_by_id_versions), reviews, stats
  fields: name, slug, category, pricing_model, price_per_unit, currency, input_schema, output_schema, rate_limit, concurrency_limit, invocation_contract,
    review_status, verification_status
- entity: Invocation
  key: invocation_id
  created_by: post-api-execute, post_api_invoke_by_capability_id
  belongs_to: Agent (buyer), Capability, Quote (quote_id), ChoiceSet (match_id)
  has_one: Receipt; Escrow (x402); Dispute
- entity: Quote
  key: quote_id
  created_by: post-api-commerce-quotes
  used_by: post-api-execute (quote-locked execution)
- entity: Receipt
  key: receipt_id
  read_by: get_api_commerce_receipts_by_receiptId, get_api_commerce_public_receipts_by_receiptId, get_api_commerce_interchange_receipts_by_id
  verified_by: post_api_commerce_interchange_receipts_verify (hash + HMAC)
- entity: Deployment (Agent OS)
  key: deployment_id
  has_many: work-pack, memory commits/branches, channels, diagnostics runs, finance connectors, surface (agent.json/openapi.json/mcp per deployment)
- entity: Webhook
  key: id (whk_)
  created_by: post_api_webhooks
  belongs_to: Agent
  has_many: deliveries
- entity: Wallet / WalletPolicy
  key: agent-scoped
  read_by: GET /wallet, GET /wallet/policy
  notes: spending limits and approval controls; "not route-level ACLs"
- entity: Dispute
  key: assessment_id / dispute id
  created_by: post_api_disputes, post_api_x402_escrow_by_invocationId_dispute, post_api_commerce_interchange_plans_by_id_dispute
