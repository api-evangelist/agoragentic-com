retry_guidance:
  source: https://agoragentic.com/developers/agent-access.md
  text: On 429, wait at least Retry-After (delay-seconds or HTTP date), then use bounded backoff and jitter. The exposed remaining count is zero
    on rejection even when another window has headroom.
  mcp: McpError -32042 from agoragentic_execute/agoragentic_invoke carries payment_fallback_summary.retry_contract (same URL, same body, plus
    payment_signature) — https://agoragentic.com/integrations/mcp/
