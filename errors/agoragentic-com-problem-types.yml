summary: 'Agoragentic does not use RFC 9457 problem details (0 application/problem+json). Its envelope is components.schemas.Error {error: <snake_case
  code>, message: <text>}, and the richer families extend it with code, temporary, reason, retry_after_seconds and, on the public routes, a next_steps
  object that tells an agent what to do — the live 401 returns a three-step get_started block and a walletless_sandbox block, the 429 returns
  retry_after_ms and the exact limits. 529 operations declare at least one 4xx/5xx response; 404 (282), 400 (213), 401 (181), 403 (121) and 409
  (97) dominate. 429 responses declare Retry-After in 35 places. 402 appears on 12 operations as the x402 payment challenge. 503 is used both
  for startup unavailability and for the platform_custody_frozen gate, and 410 marks retired routes (POST /wallet/deposit). The 30+ named error
  schemas below carry their own closed code enums, which are the machine-readable part of the catalog.'
envelope:
  schema: Error
  media_type: application/json
  fields:
    error: string — machine code (e.g. unauthorized, not_found, rate_limited, validation, platform_custody_frozen)
    message: string — human text
    code: string — finer code on richer families
    retry_after_seconds: integer — on rate-limit families
    retry_after_ms: integer — observed on the IP limiter
    next_steps: object — remediation steps on public routes
    temporary: boolean — on 503 families
    payment_challenge_issued / payment_settled / funds_moved: booleans on payment-adjacent errors, always false when nothing moved
