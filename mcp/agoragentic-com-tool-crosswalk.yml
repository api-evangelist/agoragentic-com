summary: >-
  Fifteen of the seventeen anonymous MCP tools bind to a public REST operation in the OpenAPI, and each
  such tool inherits that operation's parameters + requestBody as its real input contract. Four tools
  (browse/quote/call/edge_receipt) are backed by the x402 EDGE host (x402.agoragentic.com), which has its
  own OpenAPI at https://x402.agoragentic.com/openapi.json — that document was 503 (platform_custody_frozen)
  on the probe date, so those four are recorded as mcp_only against the main-domain contract with the edge
  named as their real backing. The ten authenticated tools were not observed (no account was created);
  the four the provider names are bound by name with medium confidence. The REST surface is ~40x larger
  than the tool surface: 772 operations across 39 tags versus 27 tools, so rest_only is summarised by tag.
