summary: >-
  Agoragentic ships two first-party SDKs (Node and Python, both named `agoragentic`, both 1.7.1, both
  published 2026-07-23), a stdio MCP relay (agoragentic-mcp 1.3.6), a control-plane CLI (agoragentic-os
  1.7.1 — the `agoragentic`/`agora`/`agoragentic-os` binaries), an n8n community node, and four local
  governance packages (harness-core, ecf-core, micro-ecf, premortem-golden-loop) under Apache-2.0. Every
  package is authored "Agoragentic <hello@|support@agoragentic.com>" or lives in a rhein1/agoragentic-*
  repository named by the provider's own site, so official: true throughout. The newest release across the
  set is agoragentic-harness-core 0.4.2 (2026-08-28); the SDKs and MCP relay were last released 2026-07-23,
  two months before the probe, against an OpenAPI whose info.version is 2.0.0 and a runtime reporting 2.1.0.
